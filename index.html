  *{box-sizing:border-box;}
  body{margin:0;background-color:var(--bg);background-image:var(--wood-bg);background-size:cover;background-position:center;background-attachment:fixed;color:var(--ink);font-size:14px;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:14px;}

  /* ---- Login ---- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:var(--bg);background-image:var(--wood-bg);background-size:cover;background-position:center;background-attachment:fixed;}
  .loginCard{background:var(--surface);border:1px solid var(--border-gold);border-radius:14px;padding:36px 32px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .loginCard h1{font-size:20px;margin:0 0 2px;color:var(--brand);}
  .loginCard .sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:600;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
  .field input:focus, .field select:focus{outline:2px solid var(--brand-light);border-color:var(--brand);}
  /* v6.9: combobox de proveedor (buscar-y-elegir), usado en Nueva CxP y Nuevo gasto recurrente */
  .comboProveedor{position:relative;}
  .comboList{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;max-height:220px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);}
  .comboList.hidden{display:none;}
  .comboOption{padding:8px 10px;font-size:14px;cursor:pointer;}
  .comboOption:hover, .comboOption.activa{background:var(--brand-light);}
  .comboEmpty{padding:8px 10px;font-size:13px;color:var(--muted);font-style:italic;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px;}
  .btn-primary{background:var(--brand);color:#fff;width:100%;justify-content:center;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--border);}
  .btn-ghost:hover{background:#f2f2f0;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn-danger{background:var(--critical-bg);color:var(--critical);}
  .btn-ok{background:var(--good-bg);color:var(--good);}
  .loginErr{background:var(--critical-bg);color:var(--critical);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px;}
  .footNote{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;}

  /* ---- App shell ---- */
  header.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .brand .titles{line-height:1.15;}
  .brand .titles b{display:block;font-size:14px;}
  .brand .titles span{font-size:11px;color:var(--muted);}
  .who{display:flex;align-items:center;gap:12px;}
  .who .name{text-align:right;line-height:1.1;}
  .who .name b{display:block;font-size:13px;}
  .who .name span{font-size:11px;color:var(--muted);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

  nav.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:55px;z-index:19;}
  nav.tabs button{background:transparent;border:none;padding:9px 14px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand);}
  nav.tabs button:hover{color:var(--brand);}

  main{padding:18px 20px 60px;max-width:1280px;margin:0 auto;}
  .viewTitle{font-size:18px;margin:4px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--bg-ink);}
  .viewTitle .actions{display:flex;gap:8px;flex-wrap:wrap;}

  .card{background:var(--surface);border:1px solid var(--border-gold);border-radius:12px;padding:16px;margin-bottom:16px;}
  .cardTitle{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 12px;text-transform:uppercase;letter-spacing:.03em;}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--surface);border:1px solid var(--border-gold);border-radius:12px;padding:14px 16px;}
  .kpi .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .kpi .value{font-size:24px;font-weight:700;}
  .kpi.alert .value{color:var(--critical);}
  .kpi.warn .value{color:var(--warning);}

  /* charts grid */
  .chartsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;}
  .chartEmpty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .barRow{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .barRow .barLbl{width:110px;flex:0 0 110px;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .barRow .barTrack{flex:1;background:#f2f2f0;border-radius:5px;height:16px;position:relative;}
  .barRow .barFill{height:100%;border-radius:5px;background:var(--brand);}
  .barRow .barVal{width:92px;flex:0 0 92px;text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .barRow.clickable{cursor:pointer;border-radius:6px;padding:3px 4px;margin:0 -4px 9px;transition:background .12s;}
  .barRow.clickable:hover{background:#f5f4f1;}
  .barRow.clickable .barLbl{color:var(--brand);font-weight:600;}
  .dashScroll{max-height:260px;overflow-y:auto;padding-right:4px;}
  .notaRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fafaf9;transition:background .12s,border-color .12s;}
  .notaRow:hover{background:#f1f0ed;border-color:var(--brand);}
  .notaRow .notaMain{min-width:0;}
  .notaRow .notaConcepto{font-weight:600;font-size:13px;}
  .notaRow .notaMeta{font-size:11px;color:var(--muted);margin-top:2px;}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);padding:8px 10px;white-space:nowrap;}

  /* Cuentas × Pagar: columna Días, Concepto clicable, menú "Opciones" y bloques colapsables

  .verGastoBtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--ink-2);font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto;transition:background .12s,border-color .12s,color .12s;}
  .verGastoBtn:hover{background:var(--brand-light);border-color:var(--brand);color:var(--brand);}

  /* ---- Adjuntos (v6.8): evidencia del gasto en CxP, comprobante de pago opcional en Pagos ----

     + lightbox de la imagen con tamaño acotado. Ver htmlCampoAdjunto/comprimirImagen/abrirLightbox. */
  .tagAdjunto{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;}
  .tag-brand{background:var(--brand-light);color:var(--brand);}

  .subidaBox{border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;outline:none;transition:border-color .12s,background .12s;}

  .subidaBox .icono{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;flex:0 0 auto;}

  .infoArchivo{flex:1;min-width:0;}

  .infoArchivo .meta{font-size:11px;color:var(--muted);}
  .quitarBtn{background:none;border:none;color:var(--critical);font-size:11.5px;font-weight:700;cursor:pointer;padding:4px;flex:0 0 auto;}
  .clipIcon{display:inline-flex;color:var(--brand);flex:0 0 auto;}

  .thumbWrap{position:relative;cursor:pointer;}
  .thumbGrande{width:100%;height:230px;border-radius:8px;object-fit:contain;border:1px solid var(--border);display:block;background:#f0efec;}
  .thumbWrap .lupa{position:absolute;bottom:6px;right:6px;width:22px;height:22px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;}

  /* lightbox: imagen agrandada con tope de tamaño fijo y botón de cerrar DENTRO de la caja (nunca
     se sale de la pantalla, ni en celular) */

  /* tarjeta de cuenta bancaria (proveedores) — una por cuenta, con espacio suficiente para CLABEs de 18 dígitos */

  .toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.2);max-width:320px;}

  .loadingOverlay{position:fixed;inset:0;background-color:var(--bg);background-image:var(--wood-bg);background-size:cover;background-position:center;color:var(--bg-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:40;}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){

    /* Adjuntar una imagen nueva no es cómodo en pantalla chica (ni pegar ni recortar) — se bloquea
       con un aviso; VER un adjunto ya subido sigue funcionando igual (botón dentro del aviso). */
    .subidaBox{display:none;}
    .avisoMovil{display:flex;}
  }
</style>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">

<script>
/* =========================================================
   CxP Portal — Grupo Nero — Frontend v5.0
   Backend: Google Apps Script Web App (ver Code.gs)
   ========================================================= */

const API_URL = 'https://script.google.com/macros/s/AKfycbzN1-Q_0QbQGdxUFbj1p25bJuCMRH97A9kbumLb_QFRfqIXx-AY3TNsmc3O-dxHD200/exec';
// Google Sheets es la única base de datos; GitHub Pages solo sirve este HTML estático.
// La sesión (token/nombre/rol) se guarda en sessionStorage (NO localStorage) únicamente
// para que recargar la página (F5, deslizar en iPhone) no pida login de nuevo mientras
// la pestaña/app siga abierta — en cuanto se cierra la pestaña o el navegador,
// sessionStorage se borra solo y la próxima vez vuelve a pedir usuario/contraseña.
// No persiste entre dispositivos ni sobrevive cerrar por completo el navegador.

const ROLES_LABEL = { admin:'Administrador', capturista:'Capturista', tesorero:'Tesorero', viewer:'Solo lectura' };

const state = {
  token: null, nombre: null, rol: null,
  proveedores: [], cxp: [], pagos: [], recurrentes: [], config: { cuentas_origen: [] },
  usuarios: [], log: [],
  view: 'dashboard',
  filtrosCxp: { sucursal:'', proveedor:'', desde:'', hasta:'', estado:'todas', texto:'' },
  filtrosPagos: { estado:'todos' },
  // Orden por columna (flechitas) — uno independiente por cada tabla/pestaña
  sortCxp:         { col: null, dir: 'asc' },
  sortProveedores: { col: null, dir: 'asc' },
  sortPagos:       { col: null, dir: 'asc' },
  sortAging:       { col: null, dir: 'asc' },
  sortCuentas:     { col: null, dir: 'asc' },
  sortUsuarios:    { col: null, dir: 'asc' },
  sortAuditoria:   { col: null, dir: 'asc' },
  sortRecurrentes: { col: null, dir: 'asc' },
  // Qué bloques colapsables de Cuentas × Pagar quedan desplegados — colapsados (false) por
  // default; se recuerda mientras la pestaña siga abierta (no sobrevive un F5, igual que los
  // demás filtros de esta vista).
  cxpBloquesAbiertos: { vigentes: false, liquidadas: false },
  // v6.8: adjuntos (evidencia/comprobante) del formulario CxP/Pago actualmente abierto — ver
  // htmlCampoAdjunto() más abajo. Se reinicia cada vez que se abre un formulario.
  adjuntos: {}
};

/* ---------------- API ---------------- */

async function api(action, payload) {
  const body = { action, token: state.token, payload: payload || {} };
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS en Apps Script
      body: JSON.stringify(body)
    });
  } catch (err) {
    throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.');
  }
  let json;
  try { json = await res.json(); }
  catch (err) { throw new Error('Respuesta inválida del servidor.'); }
  if (!json.ok) throw new Error(json.error || 'Error desconocido.');
  return json;
}

/* ---------------- Sesión (sessionStorage — se borra sola al cerrar la pestaña) ---------------- */

const SESION_KEY  = 'cxp_sesion';
const MOTIVO_KEY  = 'cxp_motivo_logout'; // mensaje a mostrar en el login tras un cierre automático

// Cierre automático por inactividad: si no hay click/tecleo/touch/scroll durante este tiempo,
// se cierra la sesión sola (aunque la pestaña siga abierta) — útil porque el dispositivo puede
// quedar compartido entre roles. No afecta la expiración de 8h que ya controla el backend
// (esa sigue siendo el tope absoluto; esta es por INACTIVIDAD, se reinicia con cualquier uso).
const INACTIVIDAD_LIMITE_MS = 60 * 60 * 1000; // 60 minutos
let ultimaActividad = Date.now();

function guardarSesionLocal() {
  try { sessionStorage.setItem(SESION_KEY, JSON.stringify({ token: state.token, nombre: state.nombre, rol: state.rol })); }
  catch (e) { /* modo privado o storage bloqueado: simplemente no persiste, sin tronar la app */ }
}
function leerSesionLocal() {
  try { const raw = sessionStorage.getItem(SESION_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function borrarSesionLocal() {
  try { sessionStorage.removeItem(SESION_KEY); } catch (e) {}
}

async function login(usuario, pin) {
  const r = await api('login', { usuario, pin });
  state.token = r.token; state.nombre = r.nombre; state.rol = r.rol;
  guardarSesionLocal();
  ultimaActividad = Date.now();
  await bootApp();
}

async function logout(motivo) {
  try { await api('logout', {}); } catch (e) {}
  borrarSesionLocal();
  if (motivo) { try { sessionStorage.setItem(MOTIVO_KEY, motivo); } catch (e) {} }
  location.reload();
}

/* ---------------- Carga de datos ---------------- */

async function loadData() {
  const r = await api('getData', {});
  state.proveedores = r.proveedores; state.cxp = r.cxp; state.pagos = r.pagos;
  state.recurrentes = r.recurrentes || []; state.config = r.config;
}

async function loadUsuarios() {
  const r = await api('getUsuarios', {});
  state.usuarios = r.usuarios;
}

async function loadLog() {
  const r = await api('getLog', {});
  state.log = r.log;
}

/* ---------------- Helpers de dominio ---------------- */

function proveedorNombre(id) {
  const p = state.proveedores.find(p => String(p.id) === String(id));
  return p ? p.nombre : '(sin proveedor)';
}

function pagosDeCxp(cxpId) {
  return state.pagos.filter(p => String(p.cxp_id) === String(cxpId));
}

function saldoCxp(cxpId, monto) {
  const pagado = pagosDeCxp(cxpId).reduce((s, p) => s + (Number(p.monto) || 0), 0);
  return (Number(monto) || 0) - pagado;
}

// --- Índices para recorrer listas grandes sin O(n×m) ---
// pagosDeCxp()/proveedorNombre() recorren TODO el arreglo correspondiente cada vez que se llaman
// (un .filter()/.find() completo). Eso es correcto para una sola nota o un solo proveedor, pero
// si se usa dentro de un .map() sobre TODAS las cuentas por pagar (p.ej. al escribir en "Buscar",
// que re-renderiza la tabla en cada tecla), el costo se multiplica: N cuentas × M pagos × cada
// tecla. Con pocas filas no se nota, pero según crece el historial del negocio sí se siente como
// que la página se queda pensando/congelada al teclear. Estos índices se arman UNA vez por
// render (no por fila) y después cada búsqueda es O(1) en vez de recorrer el arreglo completo.
function indexarPagosPorCxp(pagos) {
  const idx = new Map();
  pagos.forEach(p => {
    const key = String(p.cxp_id);
    if (!idx.has(key)) idx.set(key, []);
    idx.get(key).push(p);
  });
  return idx;
}

function indexarProveedoresPorId(proveedores) {
  const idx = new Map();
  proveedores.forEach(p => idx.set(String(p.id), p));
  return idx;
}

// Igual que saldoCxp(), pero usando un índice ya armado (ver indexarPagosPorCxp) en vez de
// filtrar todo state.pagos otra vez por cada cuenta.
function saldoDesdeIndice(cxpId, monto, pagosPorCxp) {
  const pagado = (pagosPorCxp.get(String(cxpId)) || []).reduce((s, p) => s + (Number(p.monto) || 0), 0);
  return (Number(monto) || 0) - pagado;
}

function diasEntre(a, b) { return Math.round((a - b) / 86400000); }

// Convierte una fecha "AAAA-MM-DD" (como las que guarda el Sheet, vía <input type="date">) en un Date
// a medianoche LOCAL. OJO: "new Date('AAAA-MM-DD')" la interpreta como medianoche UTC, y en husos horarios
// negativos (como México, UTC-6) eso cae en el DÍA ANTERIOR al extraer la fecha local — por eso "Hoy"/"Vencida"
// podían quedar corridos un día. Esta función evita ese corrimiento parseando los números directamente.
function parseFechaLocal(str) {
  if (!str) return null;
  const partes = String(str).slice(0, 10).split('-').map(Number);
  if (partes.length !== 3 || partes.some(n => !Number.isFinite(n))) return null;
  const [y, m, d] = partes;
  return new Date(y, m - 1, d);
}

// Los <input type="date"> a veces muestran un año "a medio escribir" (p.ej. 6 dígitos) mientras
// el usuario teclea directo en el widget nativo del navegador — es un comportamiento del propio
// input, no de este código, pero por seguridad nunca dejamos pasar un valor que no sea
// exactamente "AAAA-MM-DD" al estado de filtros (si no es válido, se trata como "sin filtro").
function fechaInputValida(v) {
  return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
}

// Compara dos fechas "sólo-día" (vía parseFechaLocal) para ordenar — robusto aunque el backend
// mande "AAAA-MM-DD" o un datetime ISO completo (ver nota en cxpFiltradas). Vacías al final.
function cmpFecha(a, b) {
  const da = parseFechaLocal(a), db = parseFechaLocal(b);
  if (!da && !db) return 0;
  if (!da) return 1;
  if (!db) return -1;
  return da - db;
}

// El segundo parámetro (saldoYaCalculado) es opcional: si quien llama ya calculó el saldo (p.ej.
// al recorrer toda la tabla con un índice, ver indexarPagosPorCxp), se lo pasa aquí para no
// recalcularlo otra vez adentro — antes esta función volvía a filtrar todos los pagos de la nota
// aunque el llamador ya tuviera el saldo a la mano, duplicando el trabajo en cada fila.
// Días entre hoy y el vencimiento de una CxP: positivo = vencida hace N días, 0 = vence hoy,
// negativo = faltan |N| días para vencer. null si la nota no tiene fecha de vencimiento
// capturada. Se separó de estadoCxp() para que la tabla de Cuentas × Pagar pueda mostrar el
// número exacto (columna "Días") sin tener que volver a calcularlo con su propia lógica de fechas.
function diasVencimiento(c) {
  if (!c.fecha_vencimiento) return null;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const fv = parseFechaLocal(c.fecha_vencimiento);
  return diasEntre(hoy, fv);
}

function estadoCxp(c, saldoYaCalculado) {
  const saldo = saldoYaCalculado !== undefined ? saldoYaCalculado : saldoCxp(c.id, c.monto);
  if (saldo <= 0.01) return 'liquidada';
  const dias = diasVencimiento(c);
  if (dias === null) return 'vigente';
  if (dias > 0) return 'vencida';
  if (dias >= -7) return 'proxima';
  return 'vigente';
}

function badgeEstadoCxp(estado) {
  const map = {
    liquidada: ['badge-good', 'Liquidada'],
    vencida:   ['badge-critical', 'Vencida'],
    proxima:   ['badge-warning', 'Por vencer'],
    vigente:   ['badge-muted', 'Vigente']
  };
  const [cls, label] = map[estado] || map.vigente;
  return `<span class="badge ${cls}">${label}</span>`;
}

// Variante del badge de estado SOLO para la tabla de Cuentas × Pagar: distingue visualmente
// "vence hoy" de "por vencer" (el resto de la app — modal de detalle, notas por proveedor —
// sigue usando badgeEstadoCxp/estadoCxp tal cual, sin el caso especial de "hoy").
function badgeEstadoCxpTabla(c, dias) {
  if (c.est === 'proxima' && dias === 0) return `<span class="badge badge-warning">Vence hoy</span>`;
  return badgeEstadoCxp(c.est);
}

// Texto de la columna "Días" de Cuentas × Pagar, coherente con el badge de arriba.
function textoDiasCxp(c, dias) {
  if (c.saldo <= 0.01) return `<span class="diasTxt d-liquidada">Pagada</span>`;
  if (dias === null) return `<span class="diasTxt d-porvencer">—</span>`;
  if (dias > 0) return `<span class="diasTxt d-vencida">${dias} día${dias === 1 ? '' : 's'}</span>`;
  if (dias === 0) return `<span class="diasTxt d-hoy">Hoy</span>`;
  const faltan = Math.abs(dias);
  return `<span class="diasTxt d-porvencer">en ${faltan} día${faltan === 1 ? '' : 's'}</span>`;
}

// v6.8: frase corta de vencimiento para el resumen condensado del modal de detalle — misma lógica
// de diasVencimiento() que ya usa la tabla, nomás en prosa ("venció hace N días" / "vence en N días").
function textoEstadoConVencimiento(c, saldo) {
  if (saldo <= 0.01) return '';
  const dias = diasVencimiento(c);
  if (dias === null) return '';
  if (dias > 0) return `venció hace ${dias} día${dias === 1 ? '' : 's'}`;
  if (dias === 0) return 'vence hoy';
  const faltan = Math.abs(dias);
  return `vence en ${faltan} día${faltan === 1 ? '' : 's'}`;
}

function badgeEstadoPago(p) {
  if (p.estado === 'pendiente_validacion') return `<span class="badge badge-warning">Pendiente de validar</span>`;
  return `<span class="badge badge-good">Validado</span>`;
}

function money(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtFecha(d) {
  if (!d) return '—';
  // Fechas "AAAA-MM-DD" (sin hora) se parsean en local para no mostrar el día anterior por huso horario;
  // cualquier otro formato (p.ej. timestamps ISO completos del log) usa el parseo normal de Date.
  const soloFecha = /^\d{4}-\d{2}-\d{2}$/.test(String(d).slice(0,10)) && String(d).length <= 10;
  const dt = soloFecha ? parseFechaLocal(d) : new Date(d);
  if (!dt || isNaN(dt)) return String(d);
  return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// v6.9: en la lista de Proveedores se muestra la CLABE/cuenta enmascarada (solo los últimos 4
// dígitos) porque esa tabla la puede ver cualquier rol, incluido "Solo lectura" — la cuenta
// completa se sigue viendo igual que antes en "Ver cuentas" / al editar el proveedor.
function maskClabe(clabe) {
  const limpio = String(clabe || '').trim();
  if (!limpio) return '—';
  return limpio.length <= 4 ? limpio : '···· ' + limpio.slice(-4);
}

function can(roles) { return roles.includes(state.rol); }

/* ---------------- Ordenamiento por columna (flechitas A-Z / Z-A / fechas / números) ---------------- */

// Indicador visual (flecha) que se pinta junto al encabezado de cada columna ordenable
function sortIndicator(sortState, col) {
  const activo = sortState && sortState.col === col;
  if (!activo) return `<span class="sortArrow">⇅</span>`;
  return `<span class="sortArrow active">${sortState.dir === 'asc' ? '▲' : '▼'}</span>`;
}

// Alterna asc/desc (o cambia de columna) y vuelve a pintar la tabla correspondiente
function toggleSort(stateKey, col, renderFnName) {
  const s = state[stateKey];
  if (s.col === col) s.dir = (s.dir === 'asc' ? 'desc' : 'asc');
  else { s.col = col; s.dir = 'asc'; }
  window[renderFnName]();
}

// Encabezado <th> clicable con su flechita — getters indica qué función de orden corresponde a cada columna
function sortTh(label, col, stateKey, renderFnName) {
  return `<th class="sortable" onclick="toggleSort('${stateKey}','${col}','${renderFnName}')">${esc(label)}${sortIndicator(state[stateKey], col)}</th>`;
}

// Ordena un arreglo de registros según sortState.col/dir usando los getters dados (uno por nombre de columna).
// Orden estable: si no hay columna activa, regresa la lista sin tocar (cada vista define su propio orden por defecto).
function sortRows(rows, sortState, getters) {
  if (!sortState || !sortState.col) return rows;
  const getter = getters[sortState.col];
  if (!getter) return rows;
  const conIndice = rows.map((r, i) => ({ r, i }));
  conIndice.sort((A, B) => {
    let a = getter(A.r), b = getter(B.r);
    if (a == null) a = '';
    if (b == null) b = '';
    if (typeof a === 'string') a = a.toLowerCase();
    if (typeof b === 'string') b = b.toLowerCase();
    if (a < b) return -1;
    if (a > b) return 1;
    return A.i - B.i; // estable
  });
  let out = conIndice.map(x => x.r);
  if (sortState.dir === 'desc') out.reverse();
  return out;
}

/* ---------------- UI: shell, nav, toasts, modal, loading ---------------- */

function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('hidden', !v); }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function openModal(html, opts) {
  opts = opts || {};
  const box = document.getElementById('modalBox');
  box.className = opts.wide ? 'wide' : '';
  box.innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function abrirLightbox(url) {
  if (!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxOverlay').classList.remove('hidden');
}
function cerrarLightbox() {
  document.getElementById('lightboxOverlay').classList.add('hidden');
  document.getElementById('lightboxImg').src = '';
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !document.getElementById('lightboxOverlay').classList.contains('hidden')) cerrarLightbox();
});

/* ---------------- Adjuntos (v6.8): evidencia del gasto (CxP) / comprobante de pago (Pagos) ----
   Campo que acepta pegar (Ctrl+V), arrastrar o elegir archivo; la imagen se comprime en el propio
   navegador (canvas, nunca sube el original) antes de mandarla al guardar. Un mismo juego de
   funciones sirve para ambos campos — se distinguen por "fieldKey" ('cxpEvidencia' | 'pagoComprobante'),
   con su estado en state.adjuntos[fieldKey]. ---------------- */

const ICONO_SUBIR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`;
const SVG_ALERTA  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.48 14.14A2 2 0 0 0 3.52 21h16.96a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>`;
const SVG_LUPA    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
const SVG_CLIP    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`;

const ADJUNTO_MAX_DIM = 1600;       // lado más largo, en px, después de redimensionar
const ADJUNTO_CALIDAD_INICIAL = 0.75;
const ADJUNTO_PESO_OBJETIVO = 350 * 1024; // ~350KB — si no se logra, se manda el mejor intento igual

function formatoKB(bytes) { return (Math.max(bytes, 0) / 1024).toFixed(0) + ' KB'; }

// Redimensiona + comprime una imagen en el navegador (canvas) y regresa { b64, mime, pesoFinal }.
// Siempre produce JPEG (incluso si el original es PNG — se pinta fondo blanco por si tenía
// transparencia) para que la compresión sea consistente y predecible.
function comprimirImagen(file) {
  return new Promise((resolve, reject) => {
    if (!file || file.type.indexOf('image') !== 0) { reject(new Error('El archivo no es una imagen.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo leer la imagen (¿archivo dañado?).'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { reject(new Error('La imagen llegó vacía.')); return; }
        const escala = Math.min(1, ADJUNTO_MAX_DIM / Math.max(w, h));
        w = Math.round(w * escala); h = Math.round(h * escala);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let calidad = ADJUNTO_CALIDAD_INICIAL;
        let dataUrl = canvas.toDataURL('image/jpeg', calidad);
        let intentos = 0;
        while (dataUrl.length * 0.75 > ADJUNTO_PESO_OBJETIVO && calidad > 0.35 && intentos < 5) {
          calidad -= 0.12;
          dataUrl = canvas.toDataURL('image/jpeg', calidad);
          intentos++;
        }
        resolve({ b64: dataUrl.split(',').pop(), mime: 'image/jpeg', pesoFinal: Math.round(dataUrl.length * 0.75) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Arma el campo de "Adjuntar" para insertar en un formGrid — reinicia state.adjuntos[fieldKey].
// opts: { titulo, esPrincipal, placeholder, urlExistente }
function htmlCampoAdjunto(fieldKey, opts) {
  const { titulo, esPrincipal, placeholder, urlExistente } = opts;
  state.adjuntos[fieldKey] = { b64: null, mime: null, clear: false, existente: !!urlExistente };
  const claseBox = esPrincipal ? 'principal' : 'secundario';
  const tag = esPrincipal ? `<span class="tagAdjunto tag-brand">Principal</span>` : `<span class="tagAdjunto tag-muted-adj">Opcional</span>`;
  const contenidoInicial = urlExistente
    ? `<img class="thumbChico" src="${esc(urlExistente)}">
       <div class="infoArchivo"><div class="nombre">Ya hay uno adjunto</div><div class="meta">Clic para reemplazar</div></div>
       <button type="button" class="quitarBtn" onclick="quitarAdjunto(event,'${fieldKey}')">Quitar</button>`
    : `<div class="icono">${ICONO_SUBIR}</div><div class="subidaTxt"><div class="t1">Clic y pega con <kbd>Ctrl+V</kbd></div><div class="t2">${esc(placeholder)}</div></div>`;
  const avisoVerBtn = urlExistente ? `<button type="button" class="verAdjuntoMovilBtn" onclick="abrirLightbox('${esc(urlExistente)}')">Ver lo ya adjuntado</button>` : '';
  return `
    <div class="field full">
      <label>${esc(titulo)} ${tag}</label>
      <div class="subidaBox ${claseBox}${urlExistente ? ' conArchivo' : ''}" id="dz_${fieldKey}" tabindex="0"
           data-placeholder="${esc(placeholder)}"
           onclick="clicAdjunto(event,'${fieldKey}')"
           onpaste="pegarAdjunto(event,'${fieldKey}')"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="soltarAdjunto(event,'${fieldKey}')">${contenidoInicial}</div>
      <input type="file" id="fi_${fieldKey}" accept="image/png,image/jpeg" style="display:none" onchange="archivoElegidoAdjunto('${fieldKey}')">
      <div class="avisoMovil">${SVG_ALERTA}<div><div class="t1">Adjuntar aquí no está disponible en celular</div><div class="t2">Usa una computadora o tablet para subir la imagen.${avisoVerBtn}</div></div></div>
    </div>
  `;
}

function clicAdjunto(ev, fieldKey) {
  if (ev.target.closest('.quitarBtn')) return; // el botón "Quitar" maneja su propio click
  document.getElementById('fi_' + fieldKey).click();
}

async function archivoElegidoAdjunto(fieldKey) {
  const fi = document.getElementById('fi_' + fieldKey);
  const file = fi.files[0];
  if (file) await procesarArchivoAdjunto(fieldKey, file, 'Elegida con el explorador');
  fi.value = '';
}

async function pegarAdjunto(ev, fieldKey) {
  const items = (ev.clipboardData || window.clipboardData)?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.indexOf('image') === 0) {
      ev.preventDefault();
      await procesarArchivoAdjunto(fieldKey, item.getAsFile(), 'Pegada del portapapeles');
      return;
    }
  }
}

async function soltarAdjunto(ev, fieldKey) {
  ev.preventDefault();
  const dz = document.getElementById('dz_' + fieldKey);
  dz.classList.remove('dragover');
  const file = ev.dataTransfer.files[0];
  if (file) await procesarArchivoAdjunto(fieldKey, file, 'Arrastrada');
}

async function procesarArchivoAdjunto(fieldKey, file, origen) {
  const dz = document.getElementById('dz_' + fieldKey);
  if (!dz) return;
  if (!/^image\/(png|jpe?g)$/.test(file.type)) { toast('Solo se aceptan imágenes JPG o PNG.', 'error'); return; }
  const placeholder = dz.dataset.placeholder || '';
  try {
    dz.innerHTML = `<div class="subidaTxt"><div class="t1">Comprimiendo…</div></div>`;
    const comp = await comprimirImagen(file);
    const existente = state.adjuntos[fieldKey]?.existente;
    state.adjuntos[fieldKey] = { b64: comp.b64, mime: comp.mime, clear: false, existente };
    const url = 'data:' + comp.mime + ';base64,' + comp.b64;
    dz.classList.add('conArchivo');
    dz.innerHTML = `
      <img class="thumbChico" src="${url}">
      <div class="infoArchivo"><div class="nombre">${esc(file.name)}</div><div class="meta">${formatoKB(file.size)} → ${formatoKB(comp.pesoFinal)} · ${esc(origen)}</div></div>
      <button type="button" class="quitarBtn" onclick="quitarAdjunto(event,'${fieldKey}')">Quitar</button>
    `;
  } catch (err) {
    toast('No se pudo procesar la imagen: ' + err.message, 'error');
    renderVacioAdjunto(fieldKey, placeholder);
  }
}

function quitarAdjunto(ev, fieldKey) {
  ev.stopPropagation();
  const eraExistente = !!state.adjuntos[fieldKey]?.existente;
  state.adjuntos[fieldKey] = { b64: null, mime: null, clear: eraExistente, existente: eraExistente };
  const dz = document.getElementById('dz_' + fieldKey);
  renderVacioAdjunto(fieldKey, dz?.dataset.placeholder || '');
}

function renderVacioAdjunto(fieldKey, placeholder) {
  const dz = document.getElementById('dz_' + fieldKey);
  if (!dz) return;
  dz.classList.remove('conArchivo');
  dz.innerHTML = `<div class="icono">${ICONO_SUBIR}</div><div class="subidaTxt"><div class="t1">Clic y pega con <kbd>Ctrl+V</kbd></div><div class="t2">${esc(placeholder)}</div></div>`;
}

// Arma los campos *_b64/*_mime/*_clear a agregar al record antes de api('save', ...) — si no hay
// nada nuevo ni se pidió quitar, no agrega nada (el backend conserva lo que ya hubiera).
function datosAdjuntoParaGuardar(fieldKey, campoB64, campoMime, campoClear) {
  const a = state.adjuntos[fieldKey];
  const extra = {};
  if (!a) return extra;
  if (a.b64) { extra[campoB64] = a.b64; extra[campoMime] = a.mime; }
  else if (a.clear) { extra[campoClear] = true; }
  return extra;
}

const TABS = [
  { id:'dashboard',   label:'Dashboard',        roles:['admin','capturista','tesorero','viewer'] },
  { id:'cxp',         label:'Cuentas × Pagar',  roles:['admin','capturista','tesorero','viewer'] },
  { id:'proveedores', label:'Proveedores',      roles:['admin','capturista','tesorero','viewer'] },
  { id:'pagos',       label:'Pagos Realizados', roles:['admin','capturista','tesorero','viewer'] },
  { id:'recurrentes', label:'Gastos Recurrentes', roles:['admin','capturista','tesorero','viewer'] },
  { id:'aging',       label:'Antigüedad',       roles:['admin','capturista','tesorero','viewer'] },
  { id:'cuentas',     label:'Mis Cuentas',      roles:['admin'] },
  { id:'usuarios',    label:'Usuarios',         roles:['admin'] },
  { id:'auditoria',   label:'Auditoría',        roles:['admin'] },
  { id:'exportar',    label:'Exportar',         roles:['admin','capturista','tesorero','viewer'] }
];

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.filter(t => can(t.roles)).map(t =>
    `<button data-tab="${t.id}" class="${state.view === t.id ? 'active' : ''}" onclick="setView('${t.id}')">${t.label}</button>`
  ).join('');
}

async function setView(view) {
  state.view = view;
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  try {
    if (view === 'dashboard')   renderDashboard();
    else if (view === 'cxp')    renderCxp();
    else if (view === 'proveedores') renderProveedores();
    else if (view === 'pagos')  renderPagos();
    else if (view === 'recurrentes') renderRecurrentes();
    else if (view === 'aging')  renderAging();
    else if (view === 'cuentas') renderCuentas();
    else if (view === 'usuarios') { showLoading(true); await loadUsuarios(); showLoading(false); renderUsuarios(); }
    else if (view === 'auditoria') { showLoading(true); await loadLog(); showLoading(false); renderAuditoria(); }
    else if (view === 'exportar') renderExportar();
  } catch (err) {
    toast(err.message, 'error');
  }
}

/* ---------------- Gráficas (SVG inline, sin dependencias externas) ---------------- */

function svgBarChart(data, opts) {
  opts = opts || {};
  const color = opts.color || '#4f46e5';
  if (!data.length) return `<div class="chartEmpty">Sin datos para mostrar.</div>`;
  const max = Math.max(...data.map(d => d.value), 1);
  return data.map(d => {
    const pct = Math.max((d.value / max) * 100, d.value > 0 ? 2 : 0);
    return `<div class="barRow">
      <div class="barLbl" title="${esc(d.label)}">${esc(d.label)}</div>
      <div class="barTrack"><div class="barFill" style="width:${pct}%;background:${color}" title="${esc(d.label)}: ${esc(opts.fmt ? opts.fmt(d.value) : d.value)}"></div></div>
      <div class="barVal">${opts.fmt ? opts.fmt(d.value) : d.value}</div>
    </div>`;
  }).join('');
}

/* ---------------- Vista: Dashboard ---------------- */

function renderDashboard() {
  const pagosPorCxp = indexarPagosPorCxp(state.pagos);
  const pendientes = state.cxp.map(c => {
      const saldo = saldoDesdeIndice(c.id, c.monto, pagosPorCxp);
      return { ...c, saldo, est: estadoCxp(c, saldo) };
    })
    .filter(c => c.saldo > 0.01);

  const totalPendiente = pendientes.reduce((s, c) => s + c.saldo, 0);
  const totalVencido = pendientes.filter(c => c.est === 'vencida').reduce((s, c) => s + c.saldo, 0);
  const totalProximo = pendientes.filter(c => c.est === 'proxima').reduce((s, c) => s + c.saldo, 0);
  const totalValidar = state.pagos.filter(p => p.estado === 'pendiente_validacion').length;

  // Por sucursal
  const porSucursal = {};
  pendientes.forEach(c => { const key = c.sucursal || '(sin sucursal)'; porSucursal[key] = (porSucursal[key] || 0) + c.saldo; });
  const dataSucursal = Object.entries(porSucursal).sort((a,b) => b[1]-a[1]).map(([label,value]) => ({label,value}));

  // Proveedores con saldo pendiente (lista completa, no solo Top 5 — clic en uno abre el desglose de sus notas)
  const porProveedor = {};
  pendientes.forEach(c => { const key = c.proveedor_id; porProveedor[key] = (porProveedor[key] || 0) + c.saldo; });
  const dataProveedor = Object.entries(porProveedor)
    .map(([id,value]) => ({ id, label: proveedorNombre(id), value }))
    .sort((a,b) => b.value-a.value);

  // Vencimientos por semana: esta semana, próxima semana, en 2/3 semanas… y el resto agrupado más adelante.
  // Las semanas van de lunes a domingo; clic en una barra filtra Cuentas × Pagar a ese rango de fechas.
  const hoyN = new Date(); hoyN.setHours(0,0,0,0);
  const inicioSemanaActual = lunesDeSemana(hoyN);
  const inicioSemanaActualIso = isoFecha(inicioSemanaActual);
  const WEEK_MS = 7 * 86400000;
  const BUCKETS_SEMANA = [
    { key:'vencidas',    label:'Vencidas',                   color:'#d03b3b' },
    { key:'hoy',         label:'Hoy',                         color:'#b8860b' },
    { key:'mañana',      label:'Mañana',                      color:'#b8860b' },
    { key:'semana0',     label:'Esta semana',                color:'#c2531f' },
    { key:'semana1',     label:'Próxima semana',             color:'#4f46e5' },
    { key:'semana2',     label:'En 2 semanas',                color:'#4f46e5' },
    { key:'semana3',     label:'En 3 semanas',                color:'#4f46e5' },
    { key:'masadelante', label:'Más adelante (+4 semanas)',  color:'#898781' },
    { key:'sinfecha',    label:'Sin fecha de vencimiento',   color:'#898781' }
  ];
  const totalesSemana = {}; BUCKETS_SEMANA.forEach(b => totalesSemana[b.key] = 0);
  pendientes.forEach(c => {
    let key = 'sinfecha';
    if (c.fecha_vencimiento) {
      const fv = parseFechaLocal(c.fecha_vencimiento);
      const diffDias = Math.round((fv - hoyN) / 86400000);
      const diffSemanas = Math.round((lunesDeSemana(fv) - inicioSemanaActual) / WEEK_MS);
      if (diffDias < 0) key = 'vencidas';
      else if (diffDias === 0) key = 'hoy';
      else if (diffDias === 1) key = 'mañana';
      else if (diffSemanas === 0) key = 'semana0';
      else if (diffSemanas === 1) key = 'semana1';
      else if (diffSemanas === 2) key = 'semana2';
      else if (diffSemanas === 3) key = 'semana3';
      else key = 'masadelante';
    }
    totalesSemana[key] += c.saldo;
  });
  const dataSemanaVenc = BUCKETS_SEMANA
    .map(b => ({ ...b, value: totalesSemana[b.key], inicioIso: inicioSemanaActualIso }))
    .filter(b => b.value > 0.01 || ['vencidas','hoy','mañana','semana0','semana1'].includes(b.key));

  // Flujo de pagos por semana del mes actual
  const hoy = new Date();
  const mesActual = hoy.getMonth(), anioActual = hoy.getFullYear();
  const semanas = [0,0,0,0,0];
  state.pagos.forEach(p => {
    if (!p.fecha) return;
    const f = parseFechaLocal(p.fecha);
    if (!f || f.getMonth() !== mesActual || f.getFullYear() !== anioActual) return;
    const semana = Math.min(4, Math.floor((f.getDate() - 1) / 7));
    semanas[semana] += Number(p.monto) || 0;
  });
  const dataSemanas = semanas.map((v,i) => ({ label: 'Semana ' + (i+1), value: v }));

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle"><span>Dashboard</span></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Total pendiente</div><div class="value">${money(totalPendiente)}</div></div>
      <div class="kpi alert"><div class="label">Vencido</div><div class="value">${money(totalVencido)}</div></div>
      <div class="kpi warn"><div class="label">Por vencer (7 días)</div><div class="value">${money(totalProximo)}</div></div>
      <div class="kpi ${totalValidar ? 'warn' : ''}"><div class="label">Pagos por validar</div><div class="value">${totalValidar}</div></div>
    </div>
    <div class="chartsGrid">
      <div class="card"><div class="cardTitle">Vencimientos por semana</div>${dashVencimientosSemanaHtml(dataSemanaVenc)}</div>
      <div class="card"><div class="cardTitle">Pendiente por sucursal</div>${svgBarChart(dataSucursal, { fmt: money })}</div>
      <div class="card">
        <div class="cardTitle">Proveedores con saldo pendiente (${dataProveedor.length})</div>
        <div class="dashScroll">${dashProveedoresListHtml(dataProveedor)}</div>
      </div>
      <div class="card"><div class="cardTitle">Flujo de pagos — ${hoy.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</div>${svgBarChart(dataSemanas, { fmt: money, color:'#1baf7a' })}</div>
    </div>
  `;
}

// Lunes (00:00) de la semana a la que pertenece una fecha dada — usado para agrupar vencimientos por semana.
function lunesDeSemana(d) {
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const dow = dt.getDay(); // 0=domingo…6=sábado
  const diff = dow === 0 ? -6 : 1 - dow;
  dt.setDate(dt.getDate() + diff);
  return dt;
}

// Formatea una fecha como AAAA-MM-DD usando sus partes locales (evita el corrimiento de día de toISOString()).
function isoFecha(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dashVencimientosSemanaHtml(buckets) {
  if (!buckets.length) return `<div class="chartEmpty">Sin cuentas pendientes.</div>`;
  const max = Math.max(...buckets.map(b => b.value), 1);
  return buckets.map(b => {
    const pct = Math.max((b.value / max) * 100, b.value > 0 ? 2 : 0);
    return `<div class="barRow clickable" onclick="irAVencimientosSemana('${b.key}','${b.inicioIso}')" title="Ver estas cuentas en Cuentas × Pagar">
      <div class="barLbl" title="${esc(b.label)}">${esc(b.label)}</div>
      <div class="barTrack"><div class="barFill" style="width:${pct}%;background:${b.color}"></div></div>
      <div class="barVal">${money(b.value)}</div>
    </div>`;
  }).join('');
}

// Clic en una barra de "Vencimientos por semana" -> filtra Cuentas × Pagar al rango de esa semana (o a "vencidas").
function irAVencimientosSemana(key, inicioIso) {
  state.filtrosCxp = { sucursal:'', proveedor:'', desde:'', hasta:'', estado:'pendientes', texto:'' };
  if (key === 'vencidas') {
    state.filtrosCxp.estado = 'vencidas';
  } else if (key === 'sinfecha') {
    // No hay filtro de "sin fecha" en Cuentas × Pagar; se muestran todas las pendientes sin acotar fecha.
  } else if (key === 'hoy' || key === 'mañana') {
    const dia = new Date(); dia.setHours(0,0,0,0);
    if (key === 'mañana') dia.setDate(dia.getDate() + 1);
    state.filtrosCxp.desde = isoFecha(dia);
    state.filtrosCxp.hasta = isoFecha(dia);
  } else {
    const inicio = new Date(inicioIso + 'T00:00:00');
    const offsets = { semana0:0, semana1:1, semana2:2, semana3:3 };
    if (key === 'masadelante') {
      const desde = new Date(inicio); desde.setDate(desde.getDate() + 28);
      state.filtrosCxp.desde = isoFecha(desde);
    } else {
      const off = offsets[key] || 0;
      const desde = new Date(inicio); desde.setDate(desde.getDate() + off*7);
      const hasta = new Date(desde); hasta.setDate(hasta.getDate() + 6);
      state.filtrosCxp.desde = isoFecha(desde);
      state.filtrosCxp.hasta = isoFecha(hasta);
    }
  }
  setView('cxp');
}

  const c = state.cxp.find(x => String(x.id) === String(cxpId));

  renderCapturaCxp(c, provId, logError);
}

/* ---------------- Vista: Cuentas × Pagar ---------------- */

function cxpFiltradas() {
  const f = state.filtrosCxp;
  // IMPORTANTE: "Vence desde/hasta" se compara con parseFechaLocal (día calendario), NO con
  // comparación de strings. Google Sheets puede guardar fecha_vencimiento como un valor de
  // fecha real (si Sheets auto-detectó el texto capturado) y entonces el backend lo manda como
  // un datetime ISO completo ("AAAA-MM-DDТnn:nn:nn.nnnZ") en vez del "AAAA-MM-DD" plano que
  // escribe el <input type="date">. Comparar esos dos strings directamente rompía el filtro
  // (p.ej. "2026-10-05T06:00:00.000Z" > "2026-10-05" siempre es true, así que "hasta" fallaba
  // incluso para la cuenta que vence justo ese día) — por eso "Hoy" mostraba "Sin resultados".
  const fDesde = f.desde ? parseFechaLocal(f.desde) : null;
  const fHasta = f.hasta ? parseFechaLocal(f.hasta) : null;
  const pagosPorCxp = indexarPagosPorCxp(state.pagos);
  const provPorId = indexarProveedoresPorId(state.proveedores);
  return state.cxp.map(c => {
      const saldo = saldoDesdeIndice(c.id, c.monto, pagosPorCxp);
      const prov = provPorId.get(String(c.proveedor_id));
      return { ...c, saldo, est: estadoCxp(c, saldo), provNombre: prov ? prov.nombre : '(sin proveedor)' };
    })
    .filter(c => {
      if (f.sucursal && c.sucursal !== f.sucursal) return false;
      if (f.proveedor && String(c.proveedor_id) !== String(f.proveedor)) return false;
      if (fDesde || fHasta) {
        const fv = parseFechaLocal(c.fecha_vencimiento);
        if (fDesde && (!fv || fv < fDesde)) return false;
        if (fHasta && (!fv || fv > fHasta)) return false;
      }
      if (f.estado === 'vencidas' && c.est !== 'vencida') return false;
      if (f.estado === 'urgentes' && !(c.est === 'vencida' || c.est === 'proxima')) return false;
      if (f.estado === 'pendientes' && c.saldo <= 0.01) return false;
      if (f.estado === 'liquidadas' && c.est !== 'liquidada') return false;
      if (f.texto) {
        const t = f.texto.toLowerCase();
        const hay = (c.concepto || '') + ' ' + c.provNombre + ' ' + (c.folio || '') + ' ' + (c.sucursal || '');
        if (!hay.toLowerCase().includes(t)) return false;
      }
      return true;
    })
    .sort((a,b) => cmpFecha(a.fecha_vencimiento, b.fecha_vencimiento));
}

// El campo "Buscar" dispara un re-render completo de la tabla en cada tecla (renderCxpTable()
// reconstruye todo el <tbody>). Con pocas cuentas no se nota, pero si el historial ya creció,
// escribir rápido podía sentirse "trabado" porque cada tecla disparaba un recálculo completo
// antes de que terminara el anterior. Este debounce espera a que la persona deje de teclear
// 180ms antes de volver a pintar la tabla — el campo de texto no se re-renderiza (vive fuera de
// #cxpTableWrap, ver renderCxp), así que no se pierde el cursor ni el foco mientras se escribe.
let _debounceCxpTabla = null;
function renderCxpTableDebounced() {
  clearTimeout(_debounceCxpTabla);
  _debounceCxpTabla = setTimeout(renderCxpTable, 180);
}

// Abre/cierra un bloque colapsable (Vigentes o Liquidadas) y vuelve a pintar la tabla para que
// las filas y la flechita queden en el estado correcto. El abierto/cerrado se recuerda en
// state.cxpBloquesAbiertos mientras la pestaña siga abierta (igual que los demás filtros de esta vista).
function toggleBloqueCxp(clave) {
  state.cxpBloquesAbiertos[clave] = !state.cxpBloquesAbiertos[clave];
  renderCxpTable();
}

function renderCxpTable() {
  const lista = cxpFiltradas().map(c => ({ ...c, dias: diasVencimiento(c) }));
  const wrap = document.getElementById('cxpTableWrap');
  if (!lista.length) { wrap.innerHTML = `<div class="tableWrap"><div class="emptyState">Sin resultados con los filtros actuales.</div></div>`; return; }

  const getters = {
    provNombre: c => c.provNombre,
    concepto: c => c.concepto || '',
    folio: c => c.folio || '',
    saldo: c => Number(c.saldo) || 0,
    fecha_vencimiento: c => { const d = parseFechaLocal(c.fecha_vencimiento); return d ? d.getTime() : 0; },
    dias: c => c.dias === null ? Infinity : c.dias
  };

  // invertir=true voltea el orden por default (más reciente primero) cuando no hay una columna
  // de orden elegida a mano por el usuario — se usa solo para "Liquidadas" (ver bloqueColapsable).
  function ordenar(items, invertir) {
    if (state.sortCxp.col) return sortRows(items, state.sortCxp, getters);
    const base = [...items].sort((a, b) => cmpFecha(a.fecha_vencimiento, b.fecha_vencimiento)); // por defecto: la que vence más pronto primero
    return invertir ? base.reverse() : base;
  }

  // Bloque siempre visible (Vencidas / Vencen hoy / Por vencer)
  function bloqueFijo(titulo, emoji, color, bg, items) {
    if (!items.length) return '';
    return `<tr class="blockHeader"><td colspan="8" style="background:${bg};color:${color};font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px">${emoji} ${esc(titulo)} (${items.length})</td></tr>`
      + ordenar(items).map(c => renderCxpRow(c)).join('');
  }

  // Bloque plegado por default (Vigentes / Liquidadas) — clic en el encabezado lo despliega;
  // las filas quedan en el DOM siempre (con display:none vía CSS) para que abrir/cerrar sea
  // instantáneo y no dependa de volver a pintar nada.
  // invertirDefault: solo "Liquidadas" lo manda en true, para que de entrada se vea la más
  // reciente primero (antes se ordenaba igual que los demás bloques: la más antigua primero,
  // que para cuentas ya pagadas no tenía mucho sentido).
  function bloqueColapsable(clave, titulo, emoji, color, bg, items, invertirDefault) {
    if (!items.length) return '';
    const abierto = !!state.cxpBloquesAbiertos[clave];
    const claseFilas = `bloqueColapsable bloqueCxp-${clave}${abierto ? ' open' : ''}`;
    return `<tr class="blockHeader" style="cursor:pointer" onclick="toggleBloqueCxp('${clave}')">
        <td colspan="8" style="background:${bg};color:${color};font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px">
          <span class="bloqueToggle${abierto ? ' open' : ''}"><span class="chev">▶</span>${emoji} ${esc(titulo)} (${items.length}) — clic para mostrar/ocultar</span>
        </td>
      </tr>`
      + ordenar(items, invertirDefault).map(c => renderCxpRow(c, claseFilas)).join('');
  }

  const vencidas  = lista.filter(c => c.est === 'vencida');
  const vencenHoy = lista.filter(c => c.est === 'proxima' && c.dias === 0);
  const porVencer = lista.filter(c => c.est === 'proxima' && c.dias !== 0);
  const vigentes   = lista.filter(c => c.est === 'vigente');
  const liquidadas = lista.filter(c => c.est === 'liquidada');

  let filasHtml = '';
  filasHtml += bloqueFijo('Vencidas', '🔴', 'var(--critical)', 'var(--critical-bg)', vencidas);
  filasHtml += bloqueFijo('Vencen hoy', '🟠', 'var(--warning)', 'var(--warning-bg)', vencenHoy);
  filasHtml += bloqueFijo('Por vencer — próximos 7 días', '⚪', 'var(--ink-2)', '#f0efec', porVencer);
  filasHtml += bloqueColapsable('vigentes', 'Vigentes — vencen en más de 7 días', '⚪', 'var(--ink-2)', '#f0efec', vigentes);
  filasHtml += bloqueColapsable('liquidadas', 'Liquidadas', '🟢', 'var(--good)', 'var(--good-bg)', liquidadas, true);

  wrap.innerHTML = `<div class="tableWrap"><table>
    <thead><tr>
      ${sortTh('Proveedor','provNombre','sortCxp','renderCxpTable')}
      ${sortTh('Concepto','concepto','sortCxp','renderCxpTable')}
      ${sortTh('Folio','folio','sortCxp','renderCxpTable')}
      ${sortTh('Saldo','saldo','sortCxp','renderCxpTable')}
      ${sortTh('Vence','fecha_vencimiento','sortCxp','renderCxpTable')}
      <th>Estado</th>
      ${sortTh('Días','dias','sortCxp','renderCxpTable')}
      <th>Opciones</th>
    </tr></thead>
    <tbody>${filasHtml}</tbody>
  </table></div>`;
}

function opcionesCuentasDestino(provId, selectedId) {
  if (!provId) return `<option value="">(selecciona un proveedor primero)</option>`;
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cuentas = prov?.cuentas || [];
  if (!cuentas.length) return `<option value="">(el proveedor no tiene cuentas registradas)</option>`;
  return `<option value="">(sin especificar)</option>` + cuentas.map(cu => {
    const label = (cu.alias || cu.banco || 'Cuenta') + (cu.banco && cu.alias ? ' — ' + cu.banco : '') + (cu.clabe ? ' (' + cu.clabe + ')' : '');
    return `<option value="${esc(cu.id)}" ${String(cu.id)===String(selectedId||'')?'selected':''}>${esc(label)}</option>`;
  }).join('');
}

// Para mostrar en texto (no <select>) la cuenta destino de un pago ya guardado: busca la cuenta del
// proveedor con ese id y arma la misma etiqueta legible que usa opcionesCuentasDestino.
function labelCuentaDestino(provId, cuentaId) {
  if (!cuentaId) return null;
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cu = (prov?.cuentas || []).find(x => String(x.id) === String(cuentaId));
  if (!cu) return null;
  return (cu.alias || cu.banco || 'Cuenta') + (cu.banco && cu.alias ? ' — ' + cu.banco : '') + (cu.clabe ? ' (' + cu.clabe + ')' : '');
}

// Opciones de "Pagar desde" tomadas de las cuentas ya registradas en "Mis Cuentas" (state.config.cuentas_origen),
// incluyendo "EFECTIVO" si está dada de alta ahí. Si el valor ya guardado (texto libre capturado antes de
// este cambio) no coincide con ninguna cuenta actual, se agrega como opción aparte para no perder el dato.
function opcionesPagarDesde(selectedValue) {
  const nombres = (state.config.cuentas_origen || []).map(cu => cu.nombre || cu.banco || cu.id).filter(Boolean);
  let html = `<option value="">(sin especificar)</option>` + nombres.map(n =>
    `<option value="${esc(n)}" ${String(n)===String(selectedValue||'')?'selected':''}>${esc(n)}</option>`
  ).join('');
  if (selectedValue && !nombres.includes(selectedValue)) {
    html += `<option value="${esc(selectedValue)}" selected>${esc(selectedValue)}</option>`;
  }
  return html;
}

// v6.9: combobox de proveedor con búsqueda — lista alfabética que se filtra conforme se escribe
// (antes era un <select> en el orden crudo de la hoja). El input oculto con id=fieldId conserva el
// id del proveedor elegido: el resto del código sigue leyendo document.getElementById(fieldId).value
// exactamente igual que con el <select> anterior, así que no hay que tocar guardarCxp/guardarRecurrente
// más que mover la validación de "requerido" aquí (un input oculto no puede mostrar la validación
// nativa del navegador).
const COMBO_PROVEEDOR_ONCHANGE = {
  cxp_proveedor_id: 'actualizarCuentasDestinoCxp',
  rec_proveedor_id: 'actualizarCuentasDestinoRecurrente'
};

function proveedoresOrdenados() {
  return [...state.proveedores].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
}

// Quita acentos y pasa a minúsculas para que buscar "coca" encuentre "COCA COLA ROO" sin importar
// mayúsculas/acentos.
function normalizarBusqueda(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

function htmlComboProveedor(fieldId, valorInicial) {
  const sel = valorInicial ? state.proveedores.find(p => String(p.id) === String(valorInicial)) : null;
  return `<div class="comboProveedor">
    <input type="hidden" id="${fieldId}" value="${esc(valorInicial || '')}">
    <input type="text" id="${fieldId}_q" class="comboInput" autocomplete="off" role="combobox" aria-expanded="false"
      placeholder="Escribe para buscar un proveedor…" value="${esc(sel ? sel.nombre : '')}"
      oninput="comboProveedorFiltrar('${fieldId}')" onfocus="comboProveedorAbrir('${fieldId}')"
      onkeydown="comboProveedorTeclado(event, '${fieldId}')" onblur="comboProveedorCerrar('${fieldId}')">
    <div class="comboList hidden" id="${fieldId}_list" role="listbox"></div>
  </div>`;
}

function comboProveedorListaFiltrada(fieldId) {
  const q = normalizarBusqueda(document.getElementById(fieldId + '_q').value);
  const todos = proveedoresOrdenados();
  return q ? todos.filter(p => normalizarBusqueda(p.nombre).includes(q)) : todos;
}

function comboProveedorRenderLista(fieldId) {
  const cont = document.getElementById(fieldId + '_list');
  if (!cont) return;
  const lista = comboProveedorListaFiltrada(fieldId);
  cont.innerHTML = lista.length
    ? lista.map(p => `<div class="comboOption" role="option" data-id="${esc(p.id)}" onmousedown="event.preventDefault()" onclick="comboProveedorSeleccionar('${fieldId}','${esc(p.id)}')">${esc(p.nombre)}</div>`).join('')
    : `<div class="comboEmpty">Sin resultados</div>`;
}

function comboProveedorAbrir(fieldId) {
  comboProveedorRenderLista(fieldId);
  document.getElementById(fieldId + '_list')?.classList.remove('hidden');
  document.getElementById(fieldId + '_q')?.setAttribute('aria-expanded', 'true');
}

function comboProveedorFiltrar(fieldId) {
  // en cuanto se vuelve a escribir, la selección previa deja de ser válida hasta que se elija
  // de nuevo de la lista (evita guardar un id que ya no corresponde al texto visible)
  document.getElementById(fieldId).value = '';
  comboProveedorAbrir(fieldId);
}

function comboProveedorSeleccionar(fieldId, provId) {
  const p = state.proveedores.find(x => String(x.id) === String(provId));
  document.getElementById(fieldId).value = provId;
  document.getElementById(fieldId + '_q').value = p ? p.nombre : '';
  comboProveedorCerrar(fieldId, true);
  const fn = COMBO_PROVEEDOR_ONCHANGE[fieldId];
  if (fn && typeof window[fn] === 'function') window[fn]();
}

function comboProveedorCerrar(fieldId, inmediato) {
  setTimeout(() => {
    document.getElementById(fieldId + '_list')?.classList.add('hidden');
    document.getElementById(fieldId + '_q')?.setAttribute('aria-expanded', 'false');
    // si lo que quedó escrito no corresponde a un proveedor seleccionado (lo borró, escribió
    // basura, o se salió del campo sin elegir), se revierte al último válido o se limpia
    const idActual = document.getElementById(fieldId)?.value;
    const p = idActual ? state.proveedores.find(x => String(x.id) === String(idActual)) : null;
    const q = document.getElementById(fieldId + '_q');
    if (q) q.value = p ? p.nombre : '';
  }, inmediato ? 0 : 120);
}

function comboProveedorTeclado(event, fieldId) {
  const cont = document.getElementById(fieldId + '_list');
  if (!cont) return;
  if (event.key === 'Escape') { comboProveedorCerrar(fieldId); event.target.blur(); return; }
  if (cont.classList.contains('hidden') && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
    comboProveedorAbrir(fieldId);
  }
  const opciones = Array.from(cont.querySelectorAll('.comboOption'));
  if (!opciones.length) return;
  let idx = opciones.findIndex(o => o.classList.contains('activa'));
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    idx = (idx + 1) % opciones.length;
    opciones.forEach(o => o.classList.remove('activa'));
    opciones[idx].classList.add('activa');
    opciones[idx].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    idx = idx <= 0 ? opciones.length - 1 : idx - 1;
    opciones.forEach(o => o.classList.remove('activa'));
    opciones[idx].classList.add('activa');
    opciones[idx].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter') {
    event.preventDefault();
    const activa = opciones.find(o => o.classList.contains('activa')) || (opciones.length === 1 ? opciones[0] : null);
    if (activa) comboProveedorSeleccionar(fieldId, activa.getAttribute('data-id'));
  }
}

function actualizarCuentasDestinoCxp() {
  const provId = document.getElementById('cxp_proveedor_id').value;
  const sel = document.getElementById('cxp_cuenta_destino_id');
  if (sel) sel.innerHTML = opcionesCuentasDestino(provId, '');

  const c = id ? state.cxp.find(x => String(x.id) === String(id)) : null;

  const provIdInicial = c?.proveedor_id || '';
  openModal(`
    <h2>${c ? 'Editar' : 'Nueva'} Cuenta por Pagar</h2>
    <form id="cxpForm" onsubmit="return guardarCxp(event, '${id || ''}')">
      <div class="formGrid">
        <div class="field full"><label>Proveedor</label>
          ${htmlComboProveedor('cxp_proveedor_id', provIdInicial)}
        </div>

async function guardarCxp(ev, id) {
  ev.preventDefault();

  // que el navegador no puede marcar como inválido de forma visible — se valida aquí a mano.

  if (!proveedorIdCxp) { toast('Elige un proveedor de la lista antes de guardar.', 'error'); return false; }
  const record = {
    id: id || ('cxp_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),

    concepto: document.getElementById('cxp_concepto').value,
    monto: document.getElementById('cxp_monto').value,
    sucursal: document.getElementById('cxp_sucursal').value,
    fecha_factura: document.getElementById('cxp_fecha_factura').value,

    notas: document.getElementById('cxp_notas').value,
    instrucciones_pago: {
      cuenta_destino_id: document.getElementById('cxp_cuenta_destino_id').value,
      referencia_sugerida: document.getElementById('cxp_referencia_sugerida').value,
      pagar_desde: document.getElementById('cxp_pagar_desde').value
    },
    ...datosAdjuntoParaGuardar('cxpEvidencia', 'evidencia_b64', 'evidencia_mime', 'evidencia_clear')
  };
  try {
    showLoading(true);
    const res = await api('save', { entity: 'cxp', record });
    await loadData();
    closeModal(); showLoading(false);
    toast('CxP guardada correctamente.', 'ok');
    if (res.warning) toast(res.warning, 'warning');
    renderCxp();
  } catch (err) { showLoading(false); toast(err.message, 'error'); }
  return false;
}

/* ---------------- Vista: Gastos Recurrentes ---------------- */
// Catálogo de gastos que se repiten cada cierto número de meses con (normalmente) el mismo monto
// (p.ej. la renta de un local). El backend (generarGastosRecurrentes, corre solo todos los días a
// las 6am) genera automáticamente la CxP correspondiente unos días antes de que venza, y recorre
// "Próxima fecha de vencimiento" hacia adelante según la frecuencia — aquí solo se da de alta y se
// mantiene (p.ej. actualizar el monto una vez al año); el portal no genera nada por sí mismo, eso
// lo hace el trigger del lado de Apps Script.

function labelFrecuencia(n) {
  const map = { 1: 'Mensual', 2: 'Bimestral', 3: 'Trimestral', 6: 'Semestral', 12: 'Anual' };
  return map[n] || ('Cada ' + n + ' meses');
}

function opcionesFrecuencia(selected) {
  const valores = [1, 2, 3, 6, 12];
  return valores.map(v => `<option value="${v}" ${Number(selected||1)===v?'selected':''}>${labelFrecuencia(v)}</option>`).join('');
}

// Formatea un Date a "AAAA-MM-DD" usando sus componentes LOCALES (nunca toISOString, que convierte
// a UTC y puede correr la fecha un día — mismo cuidado que ya se tiene en parseFechaLocal/Code.gs).
function formatYMD(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Fecha estimada en que se generará la próxima CxP (próxima vencimiento menos días de anticipación) —
// solo para mostrarla en la tabla; el cálculo real y autoritativo ocurre en el backend.
function fechaEstimadaGeneracion(r) {
  const fv = parseFechaLocal(r.proxima_fecha_vencimiento);
  if (!fv) return null;
  const d = new Date(fv);
  d.setDate(d.getDate() - (Number(r.dias_anticipacion) || 0));
  return d;
}

function renderRecurrentes() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle">
      <span>Gastos Recurrentes</span>
      <div class="actions">${can(['admin','capturista']) ? `<button class="btn btn-primary btn-sm" onclick="formRecurrente()">+ Nuevo gasto recurrente</button>` : ''}</div>
    </div>
    <p style="color:var(--muted);font-size:12px;margin-top:-6px">Para gastos que se repiten cada cierto número de meses con el mismo monto (renta, etc.) — el sistema genera la cuenta por pagar solo, unos días antes de que venza.</p>
    <div id="recurrentesTableWrap"></div>
  `;
  renderRecurrentesTable();
}

  const getters = {

  };
  lista = state.sortRecurrentes.col ? sortRows(lista, state.sortRecurrentes, getters) : [...lista].sort((a,b) => cmpFecha(a.proxima_fecha_vencimiento, b.proxima_fecha_vencimiento));

  wrap.innerHTML = `<div class="tableWrap"><table>
    <thead><tr>

      <th>Se genera el</th><th>Estado</th><th></th>
    </tr></thead>
    <tbody>${lista.map(r => {
      const estimada = fechaEstimadaGeneracion(r);
      return `<tr>
        <td>${esc(r.provNombre)}</td>

        </div></td>

    }).join('')}</tbody>
  </table></div>`;

/* ---------------- Vista: Antigüedad de saldos (Aging) ---------------- */

function renderAging() {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const buckets = { vigente:{}, b30:{}, b60:{}, b90:{}, b90p:{} };
  const totales = { vigente:0, b30:0, b60:0, b90:0, b90p:0 };
  const pagosPorCxp = indexarPagosPorCxp(state.pagos);
  const provPorId = indexarProveedoresPorId(state.proveedores);

  state.cxp.forEach(c => {
    const saldo = saldoDesdeIndice(c.id, c.monto, pagosPorCxp);
    if (saldo <= 0.01) return;
    const prov = (provPorId.get(String(c.proveedor_id)) || {}).nombre || '(sin proveedor)';
    let bucket = 'vigente';
    if (c.fecha_vencimiento) {
      const fv = parseFechaLocal(c.fecha_vencimiento);
      const dias = diasEntre(hoy, fv);
      if (dias > 90) bucket = 'b90p';
      else if (dias > 60) bucket = 'b90';
      else if (dias > 30) bucket = 'b60';
      else if (dias > 0) bucket = 'b30';
      else bucket = 'vigente';
    }
    buckets[bucket][prov] = (buckets[bucket][prov] || 0) + saldo;
    totales[bucket] += saldo;
  });

  const proveedoresConSaldo = [...new Set([
    ...Object.keys(buckets.vigente), ...Object.keys(buckets.b30), ...Object.keys(buckets.b60),
    ...Object.keys(buckets.b90), ...Object.keys(buckets.b90p)
  ])].sort();

  const totalGeneral = Object.values(totales).reduce((a,b) => a+b, 0);

  __agingFilas = proveedoresConSaldo.map(prov => {
    const v = buckets.vigente[prov]||0, b30 = buckets.b30[prov]||0, b60 = buckets.b60[prov]||0, b90 = buckets.b90[prov]||0, b90p = buckets.b90p[prov]||0;
    return { prov, v, b30, b60, b90, b90p, total: v+b30+b60+b90+b90p };
  });
  __agingTotales = totales;
  __agingTotalGeneral = totalGeneral;

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle"><span>Antigüedad de saldos (Aging)</span></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Vigente</div><div class="value">${money(totales.vigente)}</div></div>
      <div class="kpi"><div class="label">1–30 días</div><div class="value">${money(totales.b30)}</div></div>
      <div class="kpi warn"><div class="label">31–60 días</div><div class="value">${money(totales.b60)}</div></div>
      <div class="kpi warn"><div class="label">61–90 días</div><div class="value">${money(totales.b90)}</div></div>
      <div class="kpi alert"><div class="label">+90 días</div><div class="value">${money(totales.b90p)}</div></div>
    </div>
    <div id="agingTableWrap"></div>
  `;
  renderAgingTable();
}

let __agingFilas = [], __agingTotales = {}, __agingTotalGeneral = 0;

function renderAgingTable() {
  const wrap = document.getElementById('agingTableWrap');
  if (!__agingFilas.length) { wrap.innerHTML = `<div class="tableWrap"><div class="emptyState">No hay saldos pendientes. 🎉</div></div>`; return; }
  const getters = { prov: r => r.prov, v: r => r.v, b30: r => r.b30, b60: r => r.b60, b90: r => r.b90, b90p: r => r.b90p, total: r => r.total };
  const filas = sortRows(__agingFilas, state.sortAging, getters);
  wrap.innerHTML = `<div class="tableWrap"><table>
      <thead><tr>
        ${sortTh('Proveedor','prov','sortAging','renderAgingTable')}
        ${sortTh('Vigente','v','sortAging','renderAgingTable')}
        ${sortTh('1–30','b30','sortAging','renderAgingTable')}
        ${sortTh('31–60','b60','sortAging','renderAgingTable')}
        ${sortTh('61–90','b90','sortAging','renderAgingTable')}
        ${sortTh('+90','b90p','sortAging','renderAgingTable')}
        ${sortTh('Total','total','sortAging','renderAgingTable')}
      </tr></thead>
      <tbody>${filas.map(r => `<tr><td>${esc(r.prov)}</td><td class="num">${money(r.v)}</td><td class="num">${money(r.b30)}</td><td class="num">${money(r.b60)}</td><td class="num">${money(r.b90)}</td><td class="num" style="color:var(--critical);font-weight:700">${money(r.b90p)}</td><td class="num" style="font-weight:700">${money(r.total)}</td></tr>`).join('')}
      <tr style="font-weight:700;background:#fafaf9"><td>Total</td><td class="num">${money(__agingTotales.vigente)}</td><td class="num">${money(__agingTotales.b30)}</td><td class="num">${money(__agingTotales.b60)}</td><td class="num">${money(__agingTotales.b90)}</td><td class="num">${money(__agingTotales.b90p)}</td><td class="num">${money(__agingTotalGeneral)}</td></tr>
      </tbody>
    </table></div>`;
}

function renderProveedoresTable() {
  const wrap = document.getElementById('proveedoresTableWrap');
  // v6.9: la lista ya no muestra Email/Teléfono (casi siempre vacíos) — en su lugar, Banco y
  // Cuenta (enmascarada) de la PRIMERA cuenta registrada, con un "+N más" si hay otras. Email y
  // Teléfono se siguen pudiendo capturar/editar igual, solo que ya no ocupan columna en la lista.
  const getters = {
    nombre: p => p.nombre || '',
    rfc: p => p.rfc || '',
    banco: p => (p.cuentas||[])[0]?.banco || '',
    cuenta: p => (p.cuentas||[])[0]?.clabe || ''
  };
  const lista = sortRows(state.proveedores, state.sortProveedores, getters);
  wrap.innerHTML = `<div class="tableWrap"><table>
      <thead><tr>
        ${sortTh('Nombre','nombre','sortProveedores','renderProveedoresTable')}
        ${sortTh('RFC','rfc','sortProveedores','renderProveedoresTable')}
        ${sortTh('Banco','banco','sortProveedores','renderProveedoresTable')}
        ${sortTh('Cuenta','cuenta','sortProveedores','renderProveedoresTable')}
        <th></th>
      </tr></thead>
      <tbody>${lista.map(p => {
        const cuentas = p.cuentas || [];
        const principal = cuentas[0];
        const extra = cuentas.length > 1 ? ` <span class="badge badge-muted" title="Tiene ${cuentas.length} cuentas registradas">+${cuentas.length - 1} más</span>` : '';
        return `
        <tr>
          <td>${esc(p.nombre)}</td><td>${esc(p.rfc||'—')}</td>
          <td>${esc(principal?.banco || '—')}</td>
          <td style="font-variant-numeric:tabular-nums">${esc(maskClabe(principal?.clabe))}${extra}</td>
          <td><div class="rowActions">
            <button class="btn btn-ghost btn-sm" onclick="verCuentasProveedor('${p.id}')">Ver cuentas</button>
            ${can(['admin']) ? `<button class="btn btn-ghost btn-sm" onclick="formProveedor('${p.id}')">Editar</button>` : ''}
            ${can(['admin']) ? `<button class="btn btn-danger btn-sm" onclick="confirmarEliminar('prov','${p.id}','este proveedor (y sus CxP/pagos)')">Eliminar</button>` : ''}
          </div></td>
        </tr>`;
      }).join('') || `<tr><td colspan="5" class="emptyState">Sin proveedores.</td></tr>`}
      </tbody>
    </table></div>`;
}

  const p = state.proveedores.find(x => String(x.id) === String(id));
  const cuentas = p?.cuentas || [];
  openModal(`
    <h2>Cuentas de ${esc(p ? p.nombre : '')}</h2>
    ${!cuentas.length ? `<p class="emptyState">Este proveedor no tiene cuentas bancarias registradas todavía.</p>` : `
    <div class="tableWrap" style="border:1px solid var(--border)"><table>
      <thead><tr><th>Alias</th><th>Banco</th><th>CLABE / Cuenta</th><th>Titular</th></tr></thead>
      <tbody>${cuentas.map(c => `
        <tr>
          <td>${esc(c.alias || '—')}</td>
          <td>${esc(c.banco || '—')}</td>
          <td style="font-variant-numeric:tabular-nums">${esc(c.clabe || '—')}</td>
          <td>${esc(c.titular || '—')}</td>

let __pvCuentasTmp = [];

function formProveedor(id) {
  const p = id ? state.proveedores.find(x => String(x.id) === String(id)) : null;
  __pvCuentasTmp = (p?.cuentas || []).map(c => ({ ...c }));
  openModal(`
    <h2>${p ? 'Editar' : 'Nuevo'} proveedor</h2>
    <form onsubmit="return guardarProveedor(event, '${id||''}')">
      <div class="formGrid">
        <div class="field full"><label>Nombre</label><input id="pv_nombre" value="${esc(p?.nombre||'')}" required></div>
        <div class="field"><label>RFC</label><input id="pv_rfc" value="${esc(p?.rfc||'')}"></div>
        <div class="field"><label>Email</label><input type="email" id="pv_email" value="${esc(p?.email||'')}"></div>
        <div class="field"><label>Teléfono</label><input id="pv_telefono" value="${esc(p?.telefono||'')}"></div>
        <div class="field full"><label>Notas</label><input id="pv_notas" value="${esc(p?.notas||'')}"></div>
      </div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="viewTitle" style="margin-bottom:6px"><span style="font-size:14px">Cuentas bancarias del proveedor</span>
          <div class="actions"><button type="button" class="btn btn-ghost btn-sm" onclick="agregarCuentaProveedorTmp()">+ Agregar cuenta</button></div>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:0 0 10px">Registra todas las cuentas donde este proveedor puede recibir pago. Si al pagar una no sirve, se podrá elegir otra desde la misma CxP sin tener que volver aquí.</p>
        <div id="pvCuentasList">${renderCuentasProveedorRows()}</div>
      </div>
      <div class="modalActions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  `, { wide: true });
}

function renderCuentasProveedorRows() {
  if (!__pvCuentasTmp.length) return `<p class="emptyState" style="padding:10px 0">Sin cuentas registradas.</p>`;
  return __pvCuentasTmp.map((c, i) => `
    <div class="cuentaRow" data-id="${esc(c.id||'')}">
      <div class="cuentaHead">
        <b>Cuenta ${i+1}</b>
        <button type="button" class="btn btn-danger btn-sm" onclick="eliminarCuentaProveedorTmp(this)">Eliminar</button>
      </div>
      <div class="formGrid">
        <div class="field"><label>Alias</label><input class="cta_alias" value="${esc(c.alias||'')}" placeholder="Ej. Principal"></div>
        <div class="field"><label>Banco</label><input class="cta_banco" value="${esc(c.banco||'')}" placeholder="Ej. SANTANDER"></div>
        <div class="field full"><label>CLABE / Número de cuenta</label><input class="cta_clabe" value="${esc(c.clabe||'')}" placeholder="18 dígitos"></div>
        <div class="field full"><label>Titular</label><input class="cta_titular" value="${esc(c.titular||'')}"></div>
      </div>
    </div>`).join('');
}

function leerCuentasProveedorDesdeDOM() {
  const rows = document.querySelectorAll('#pvCuentasList .cuentaRow');
  const out = [];
  rows.forEach(row => {
    out.push({
      id: row.dataset.id || ('cta_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)),
      alias: row.querySelector('.cta_alias').value.trim(),
      banco: row.querySelector('.cta_banco').value.trim(),
      clabe: row.querySelector('.cta_clabe').value.trim(),
      titular: row.querySelector('.cta_titular').value.trim()
    });
  });
  __pvCuentasTmp = out;
}

function agregarCuentaProveedorTmp() {
  leerCuentasProveedorDesdeDOM();
  __pvCuentasTmp.push({ id: 'cta_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), alias:'', banco:'', clabe:'', titular:'' });
  document.getElementById('pvCuentasList').innerHTML = renderCuentasProveedorRows();
}

function eliminarCuentaProveedorTmp(btn) {
  leerCuentasProveedorDesdeDOM();
  const id = btn.closest('.cuentaRow').dataset.id;
  __pvCuentasTmp = __pvCuentasTmp.filter(c => c.id !== id);
  document.getElementById('pvCuentasList').innerHTML = renderCuentasProveedorRows();
}

async function guardarProveedor(ev, id) {
  ev.preventDefault();
  leerCuentasProveedorDesdeDOM();
  const cuentas = __pvCuentasTmp.filter(c => c.alias || c.banco || c.clabe || c.titular);
  const record = {
    id: id || ('prov_' + Date.now()),
    nombre: document.getElementById('pv_nombre').value,
    rfc: document.getElementById('pv_rfc').value,
    email: document.getElementById('pv_email').value,
    telefono: document.getElementById('pv_telefono').value,
    notas: document.getElementById('pv_notas').value,
    cuentas
  };
  try {
    showLoading(true);
    await api('save', { entity: 'prov', record });
    await loadData();
    closeModal(); showLoading(false);
    toast('Proveedor guardado.', 'ok');
    renderProveedores();
  } catch (err) { showLoading(false); toast(err.message, 'error'); }
  return false;
}
