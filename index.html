// Menú "Opciones" (⋮) de cada fila de Cuentas × Pagar — agrupa Registrar pago / Editar / Eliminar
// (antes botones sueltos) respetando los mismos permisos por rol de siempre. Un solo listener
// global (ver el final del script) cierra cualquier menú abierto al hacer clic fuera.
function opcionesCxpMenu(c) {
  const items = [];
  if (can(['admin','capturista','tesorero']) && c.saldo > 0.01) items.push(`<button onclick="cerrarMenusCxp(); formPago('${c.id}')">💰 Registrar pago</button>`);
  if (can(['admin','capturista'])) items.push(`<button onclick="cerrarMenusCxp(); formCxp('${c.id}')">✏️ Editar</button>`);
  if (can(['admin'])) items.push(`<button class="danger" onclick="cerrarMenusCxp(); confirmarEliminar('cxp','${c.id}','esta CxP')">🗑️ Eliminar</button>`);
  if (!items.length) return '';
  return `<div class="optMenuWrap">
      <button class="optMenuBtn" onclick="toggleMenuCxp(event,'${c.id}')" title="Opciones">⋮</button>
      <div class="optMenu" id="menuCxp-${c.id}">${items.join('')}</div>
    </div>`;
}

function toggleMenuCxp(ev, id) {
  ev.stopPropagation();
  const el = document.getElementById('menuCxp-' + id);
  const yaAbierto = el.classList.contains('open');
  cerrarMenusCxp();
  if (!yaAbierto) el.classList.add('open');
}
function cerrarMenusCxp() { document.querySelectorAll('.optMenu.open').forEach(el => el.classList.remove('open')); }

function renderCxpRow(c, extraClass) {
  const dias = c.dias !== undefined ? c.dias : diasVencimiento(c);
  return `
      <tr${extraClass ? ` class="${extraClass}"` : ''}>
        <td>${esc(c.provNombre)}</td>
        <td><div class="conceptoCelda"><button class="verGastoBtn" onclick="verCapturaCxp('${c.id}')" title="Ver detalle del gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>Ver</button><span>${esc(c.concepto || '(sin concepto)')}${c.recurrente_id ? ` <span class="badge badge-muted" title="Generada automáticamente desde Gastos Recurrentes">🔁 recurrente</span>` : ''}</span>${c.adjunto_evidencia_url ? `<span class="clipIcon" title="Tiene evidencia adjunta">${SVG_CLIP}</span>` : ''}</div></td>
        <td>${esc(c.folio || '')}</td>
        <td class="num">${money(c.saldo)}</td>
        <td>${fmtFecha(c.fecha_vencimiento)}</td>
        <td>${badgeEstadoCxpTabla(c, dias)}</td>
        <td>${textoDiasCxp(c, dias)}</td>
        <td>${opcionesCxpMenu(c)}</td>
      </tr>`;
}

// El campo "Buscar" dispara un re-render completo de la tabla en cada tecla (renderCxpTable()
// reconstruye todo el <tbody>). Con pocas cuentas no se nota, pero si el historial ya creció,
// escribir rápido podía sentirse "trabado" porque cada tecla disparaba un recálculo completo
// antes de que terminara el anterior. Este debounce espera a que la persona deje de teclear
// 180ms antes de volver a pintar la tabla — el campo de texto no se re-renderiza (vive fuera de
// #cxpTableWrap, ver renderCxp), así que no se pierde el cursor ni el foco mientras se escribe.
let _debounceCxpTabla = null;
function renderCxpTableDebounced() {
  clearTimeout(_debounceCxpTabla);
  _debounceCxpTabla = setTimeout(renderCxpTable, 180);
}

// Abre/cierra un bloque colapsable (Vigentes o Liquidadas) y vuelve a pintar la tabla para que
// las filas y la flechita queden en el estado correcto. El abierto/cerrado se recuerda en
// state.cxpBloquesAbiertos mientras la pestaña siga abierta (igual que los demás filtros de esta vista).
function toggleBloqueCxp(clave) {
  state.cxpBloquesAbiertos[clave] = !state.cxpBloquesAbiertos[clave];
  renderCxpTable();
}

function renderCxpTable() {
  const lista = cxpFiltradas().map(c => ({ ...c, dias: diasVencimiento(c) }));
  const wrap = document.getElementById('cxpTableWrap');
  if (!lista.length) { wrap.innerHTML = `<div class="tableWrap"><div class="emptyState">Sin resultados con los filtros actuales.</div></div>`; return; }

  const getters = {
    provNombre: c => c.provNombre,
    concepto: c => c.concepto || '',
    folio: c => c.folio || '',
    saldo: c => Number(c.saldo) || 0,
    fecha_vencimiento: c => { const d = parseFechaLocal(c.fecha_vencimiento); return d ? d.getTime() : 0; },
    dias: c => c.dias === null ? Infinity : c.dias
  };

  // invertir=true voltea el orden por default (más reciente primero) cuando no hay una columna
  // de orden elegida a mano por el usuario — se usa solo para "Liquidadas" (ver bloqueColapsable).
  function ordenar(items, invertir) {
    if (state.sortCxp.col) return sortRows(items, state.sortCxp, getters);
    const base = [...items].sort((a, b) => cmpFecha(a.fecha_vencimiento, b.fecha_vencimiento)); // por defecto: la que vence más pronto primero
    return invertir ? base.reverse() : base;
  }

  // Bloque siempre visible (Vencidas / Vencen hoy / Por vencer)
  function bloqueFijo(titulo, emoji, color, bg, items) {
    if (!items.length) return '';
    return `<tr class="blockHeader"><td colspan="8" style="background:${bg};color:${color};font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px">${emoji} ${esc(titulo)} (${items.length})</td></tr>`
      + ordenar(items).map(c => renderCxpRow(c)).join('');
  }

  // Bloque plegado por default (Vigentes / Liquidadas) — clic en el encabezado lo despliega;
  // las filas quedan en el DOM siempre (con display:none vía CSS) para que abrir/cerrar sea
  // instantáneo y no dependa de volver a pintar nada.
  // invertirDefault: solo "Liquidadas" lo manda en true, para que de entrada se vea la más
  // reciente primero (antes se ordenaba igual que los demás bloques: la más antigua primero,
  // que para cuentas ya pagadas no tenía mucho sentido).
  function bloqueColapsable(clave, titulo, emoji, color, bg, items, invertirDefault) {
    if (!items.length) return '';
    const abierto = !!state.cxpBloquesAbiertos[clave];
    const claseFilas = `bloqueColapsable bloqueCxp-${clave}${abierto ? ' open' : ''}`;
    return `<tr class="blockHeader" style="cursor:pointer" onclick="toggleBloqueCxp('${clave}')">
        <td colspan="8" style="background:${bg};color:${color};font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px">
          <span class="bloqueToggle${abierto ? ' open' : ''}"><span class="chev">▶</span>${emoji} ${esc(titulo)} (${items.length}) — clic para mostrar/ocultar</span>
        </td>
      </tr>`
      + ordenar(items, invertirDefault).map(c => renderCxpRow(c, claseFilas)).join('');
  }

  const vencidas  = lista.filter(c => c.est === 'vencida');
  const vencenHoy = lista.filter(c => c.est === 'proxima' && c.dias === 0);
  const vencenManana = lista.filter(c => c.est === 'proxima' && c.dias === -1);
  const porVencer = lista.filter(c => c.est === 'proxima' && c.dias !== 0 && c.dias !== -1);
  const vigentes   = lista.filter(c => c.est === 'vigente');
  const liquidadas = lista.filter(c => c.est === 'liquidada');

  let filasHtml = '';
  filasHtml += bloqueFijo('Vencidas', '🔴', 'var(--critical)', 'var(--critical-bg)', vencidas);
  filasHtml += bloqueFijo('Vencen hoy', '🟠', 'var(--warning)', 'var(--warning-bg)', vencenHoy);
  filasHtml += bloqueFijo('Vencen mañana', '🟡', 'var(--warning)', 'var(--warning-bg)', vencenManana);
  filasHtml += bloqueFijo('Por vencer — próximos 7 días', '⚪', 'var(--ink-2)', '#f0efec', porVencer);
  filasHtml += bloqueColapsable('vigentes', 'Vigentes — vencen en más de 7 días', '⚪', 'var(--ink-2)', '#f0efec', vigentes);
  filasHtml += bloqueColapsable('liquidadas', 'Liquidadas', '🟢', 'var(--good)', 'var(--good-bg)', liquidadas, true);

  wrap.innerHTML = `<div class="tableWrap"><table>
    <thead><tr>
      ${sortTh('Proveedor','provNombre','sortCxp','renderCxpTable')}
      ${sortTh('Concepto','concepto','sortCxp','renderCxpTable')}
      ${sortTh('Folio','folio','sortCxp','renderCxpTable')}
      ${sortTh('Saldo','saldo','sortCxp','renderCxpTable')}
      ${sortTh('Vence','fecha_vencimiento','sortCxp','renderCxpTable')}
      <th>Estado</th>
      ${sortTh('Días','dias','sortCxp','renderCxpTable')}
      <th>Opciones</th>
    </tr></thead>
    <tbody>${filasHtml}</tbody>
  </table></div>`;
}

function opcionesCuentasDestino(provId, selectedId) {
  if (!provId) return `<option value="">(selecciona un proveedor primero)</option>`;
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cuentas = prov?.cuentas || [];
  if (!cuentas.length) return `<option value="">(el proveedor no tiene cuentas registradas)</option>`;
  return `<option value="">(sin especificar)</option>` + cuentas.map(cu => {
    const label = labelCuenta(cu);
    return `<option value="${esc(cu.id)}" ${String(cu.id)===String(selectedId||'')?'selected':''}>${esc(label)}</option>`;
  }).join('');
}

// Etiqueta legible de una cuenta bancaria para mostrar en los <select>/textos de "cuenta destino":
// Banco — Cliente (últimos 4 dígitos de la cuenta), omitiendo cada parte que no esté capturada.
// Antes se armaba con "alias"; como ese campo ya no se usa, Banco + Cliente son los datos que
// realmente distinguen una cuenta de otra cuando el proveedor tiene varias.
function labelCuenta(cu) {
  const partes = [cu.banco || 'Cuenta'];
  if (cu.cliente) partes.push(cu.cliente);
  let label = partes.join(' — ');
  if (cu.clabe && cu.clabe.length >= 4) label += ' (···' + cu.clabe.slice(-4) + ')';
  return label;
}

// Para mostrar en texto (no <select>) la cuenta destino de un pago ya guardado: busca la cuenta del
// proveedor con ese id y arma la misma etiqueta legible que usa opcionesCuentasDestino.
function labelCuentaDestino(provId, cuentaId) {
  if (!cuentaId) return null;
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cu = (prov?.cuentas || []).find(x => String(x.id) === String(cuentaId));
  if (!cu) return null;
  return labelCuenta(cu);
}

// v6.10: cada cuenta bancaria del proveedor ya trae su propia "referencia" (lo que hay que anotar
// al pagar — depende de con cuál de tus sucursales/razones sociales te facturó ese proveedor, no
// de la cuenta en sí, pero vive junto con la cuenta para no duplicar catálogos). Al elegir la
// cuenta destino en una CxP/pago, se sugiere automáticamente esa referencia (ver
// sugerirReferenciaCxp/sugerirReferenciaPago) — el campo se queda editable por si hace falta un
// ajuste puntual.
function referenciaDeCuenta(provId, cuentaId) {
  if (!cuentaId) return '';
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cu = (prov?.cuentas || []).find(x => String(x.id) === String(cuentaId));
  return cu?.referencia || '';
}

// Mismo mecanismo que referenciaDeCuenta pero para el campo "Cliente" de la cuenta — se muestra como
// aviso (no editable) junto al selector de cuenta destino, para recordar con qué cliente/razón social
// se facturó esa cuenta en particular.
function clienteDeCuenta(provId, cuentaId) {
  if (!cuentaId) return '';
  const prov = state.proveedores.find(p => String(p.id) === String(provId));
  const cu = (prov?.cuentas || []).find(x => String(x.id) === String(cuentaId));
  return cu?.cliente || '';
}

// Opciones de "Pagar desde" tomadas de las cuentas ya registradas en "Mis Cuentas" (state.config.cuentas_origen),
// incluyendo "EFECTIVO" si está dada de alta ahí. Si el valor ya guardado (texto libre capturado antes de
// este cambio) no coincide con ninguna cuenta actual, se agrega como opción aparte para no perder el dato.
function opcionesPagarDesde(selectedValue) {
  const nombres = (state.config.cuentas_origen || []).map(cu => cu.nombre || cu.banco || cu.id).filter(Boolean);
  let html = `<option value="">(sin especificar)</option>` + nombres.map(n =>
    `<option value="${esc(n)}" ${String(n)===String(selectedValue||'')?'selected':''}>${esc(n)}</option>`
  ).join('');
  if (selectedValue && !nombres.includes(selectedValue)) {
    html += `<option value="${esc(selectedValue)}" selected>${esc(selectedValue)}</option>`;
  }
  return html;
}

// v6.9: combobox de proveedor con búsqueda — lista alfabética que se filtra conforme se escribe
// (antes era un <select> en el orden crudo de la hoja). El input oculto con id=fieldId conserva el
// id del proveedor elegido: el resto del código sigue leyendo document.getElementById(fieldId).value
// exactamente igual que con el <select> anterior, así que no hay que tocar guardarCxp/guardarRecurrente
// más que mover la validación de "requerido" aquí (un input oculto no puede mostrar la validación
// nativa del navegador).
const COMBO_PROVEEDOR_ONCHANGE = {
  cxp_proveedor_id: 'actualizarCuentasDestinoCxp',
  rec_proveedor_id: 'actualizarCuentasDestinoRecurrente'
};

function proveedoresOrdenados() {
  return [...state.proveedores].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
}

// Quita acentos y pasa a minúsculas para que buscar "coca" encuentre "COCA COLA ROO" sin importar
// mayúsculas/acentos.
function normalizarBusqueda(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

function htmlComboProveedor(fieldId, valorInicial) {
  const sel = valorInicial ? state.proveedores.find(p => String(p.id) === String(valorInicial)) : null;
  return `<div class="comboProveedor">
    <input type="hidden" id="${fieldId}" value="${esc(valorInicial || '')}">
    <input type="text" id="${fieldId}_q" class="comboInput" autocomplete="off" role="combobox" aria-expanded="false"
      placeholder="Escribe para buscar un proveedor…" value="${esc(sel ? sel.nombre : '')}"
      oninput="comboProveedorFiltrar('${fieldId}')" onfocus="comboProveedorAbrir('${fieldId}')"
      onkeydown="comboProveedorTeclado(event, '${fieldId}')" onblur="comboProveedorCerrar('${fieldId}')">
    <div class="comboList hidden" id="${fieldId}_list" role="listbox"></div>
  </div>`;
}

function comboProveedorListaFiltrada(fieldId) {
  const q = normalizarBusqueda(document.getElementById(fieldId + '_q').value);
  const todos = proveedoresOrdenados();
  return q ? todos.filter(p => normalizarBusqueda(p.nombre).includes(q)) : todos;
}

function comboProveedorRenderLista(fieldId) {
  const cont = document.getElementById(fieldId + '_list');
  if (!cont) return;
  const lista = comboProveedorListaFiltrada(fieldId);
  cont.innerHTML = lista.length
    ? lista.map(p => `<div class="comboOption" role="option" data-id="${esc(p.id)}" onmousedown="event.preventDefault()" onclick="comboProveedorSeleccionar('${fieldId}','${esc(p.id)}')">${esc(p.nombre)}</div>`).join('')
    : `<div class="comboEmpty">Sin resultados</div>`;
}

function comboProveedorAbrir(fieldId) {
  comboProveedorRenderLista(fieldId);
  document.getElementById(fieldId + '_list')?.classList.remove('hidden');
  document.getElementById(fieldId + '_q')?.setAttribute('aria-expanded', 'true');
}

function comboProveedorFiltrar(fieldId) {
  // en cuanto se vuelve a escribir, la selección previa deja de ser válida hasta que se elija
  // de nuevo de la lista (evita guardar un id que ya no corresponde al texto visible)
  document.getElementById(fieldId).value = '';
  comboProveedorAbrir(fieldId);
}

function comboProveedorSeleccionar(fieldId, provId) {
  const p = state.proveedores.find(x => String(x.id) === String(provId));
  document.getElementById(fieldId).value = provId;
  document.getElementById(fieldId + '_q').value = p ? p.nombre : '';
  comboProveedorCerrar(fieldId, true);
  const fn = COMBO_PROVEEDOR_ONCHANGE[fieldId];
  if (fn && typeof window[fn] === 'function') window[fn]();
}

function comboProveedorCerrar(fieldId, inmediato) {
  setTimeout(() => {
    document.getElementById(fieldId + '_list')?.classList.add('hidden');
    document.getElementById(fieldId + '_q')?.setAttribute('aria-expanded', 'false');
    // si lo que quedó escrito no corresponde a un proveedor seleccionado (lo borró, escribió
    // basura, o se salió del campo sin elegir), se revierte al último válido o se limpia
    const idActual = document.getElementById(fieldId)?.value;
    const p = idActual ? state.proveedores.find(x => String(x.id) === String(idActual)) : null;
    const q = document.getElementById(fieldId + '_q');
    if (q) q.value = p ? p.nombre : '';
  }, inmediato ? 0 : 120);
}

function comboProveedorTeclado(event, fieldId) {
  const cont = document.getElementById(fieldId + '_list');
  if (!cont) return;
  if (event.key === 'Escape') { comboProveedorCerrar(fieldId); event.target.blur(); return; }
  if (cont.classList.contains('hidden') && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
    comboProveedorAbrir(fieldId);
  }
  const opciones = Array.from(cont.querySelectorAll('.comboOption'));
  if (!opciones.length) return;
  let idx = opciones.findIndex(o => o.classList.contains('activa'));
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    idx = (idx + 1) % opciones.length;
    opciones.forEach(o => o.classList.remove('activa'));
    opciones[idx].classList.add('activa');
    opciones[idx].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'ArrowUp') {
    event.preventDefault();
    idx = idx <= 0 ? opciones.length - 1 : idx - 1;
    opciones.forEach(o => o.classList.remove('activa'));
    opciones[idx].classList.add('activa');
    opciones[idx].scrollIntoView({ block: 'nearest' });
  } else if (event.key === 'Enter') {
    event.preventDefault();
    const activa = opciones.find(o => o.classList.contains('activa')) || (opciones.length === 1 ? opciones[0] : null);
    if (activa) comboProveedorSeleccionar(fieldId, activa.getAttribute('data-id'));
  }
}

function actualizarCuentasDestinoCxp() {
  const provId = document.getElementById('cxp_proveedor_id').value;
  const sel = document.getElementById('cxp_cuenta_destino_id');
  if (sel) sel.innerHTML = opcionesCuentasDestino(provId, '');
}

// v6.10: al elegir una cuenta destino, sugiere la referencia guardada en esa cuenta (si tiene) —
// no borra lo que ya esté escrito si la cuenta elegida no trae referencia guardada.
function sugerirReferenciaCxp() {
  const provId = document.getElementById('cxp_proveedor_id').value;
  const cuentaId = document.getElementById('cxp_cuenta_destino_id').value;
  const ref = referenciaDeCuenta(provId, cuentaId);

  actualizarClienteHint('cxp_cliente_hint', clienteDeCuenta(provId, cuentaId));

// Muestra/oculta el aviso "Cliente: X" junto al selector de cuenta destino — se queda vacío/oculto
// si la cuenta elegida no tiene cliente capturado, en vez de mostrar un hint vacío.
function actualizarClienteHint(elId, cliente) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = cliente ? ('Cliente: ' + cliente) : '';
  el.classList.toggle('hidden', !cliente);
}

async function guardarCxp(ev, id) {
  ev.preventDefault();
  // el <select> nativo validaba "requerido" solo; el combobox de búsqueda usa un input oculto,
  // que el navegador no puede marcar como inválido de forma visible — se valida aquí a mano.
  const proveedorIdCxp = document.getElementById('cxp_proveedor_id').value;
  if (!proveedorIdCxp) { toast('Elige un proveedor de la lista antes de guardar.', 'error'); return false; }
  const desbloquear = bloquearFormulario(ev.target, 'Guardando…');
  const record = {
    id, // ya viene fijo desde formCxp (ver nota ahí) — seguro reintentar con el mismo id.
    proveedor_id: proveedorIdCxp,
    concepto: document.getElementById('cxp_concepto').value,
    monto: document.getElementById('cxp_monto').value,
    sucursal: document.getElementById('cxp_sucursal').value,
    fecha_factura: document.getElementById('cxp_fecha_factura').value,

    },

  };
  try {
    showLoading(true);
    // v6.10: si este guardado trae una foto nueva, Code.gs la sube a Drive antes de escribir la

    const res = await api('save', { entity: 'cxp', record }, record.evidencia_b64 ? { timeoutMs: API_TIMEOUT_MS_ADJUNTO } : undefined);

/* ---------------- Registrar / validar pagos ---------------- */

// v6.10: mismo mecanismo que sugerirReferenciaCxp pero para el formulario de pago — recibe el
// proveedor_id directo porque aquí ya es fijo (viene de la CxP que se está pagando).
function sugerirReferenciaPago(provId) {
  const cuentaId = document.getElementById('pg_cuenta_destino_id').value;
  const ref = referenciaDeCuenta(provId, cuentaId);
  if (ref) document.getElementById('pg_referencia').value = ref;
  actualizarClienteHint('pg_cliente_hint', clienteDeCuenta(provId, cuentaId));
}

function formPago(cxpId, pagoId) {
  const c = state.cxp.find(x => String(x.id) === String(cxpId));
  const pago = pagoId ? state.pagos.find(x => String(x.id) === String(pagoId)) : null;
  // Al editar, el monto del propio pago ya está descontado del saldo (sigue en state.pagos) —
  // se vuelve a sumar aquí para no mostrar/limitar el saldo como si ese pago no existiera.
  const saldo = saldoCxp(cxpId, c.monto) + (pago ? (Number(pago.monto) || 0) : 0);
  const prov = state.proveedores.find(p => String(p.id) === String(c.proveedor_id));
  const cuentasDestino = prov?.cuentas || [];
  const ip = c.instrucciones_pago || {};
  let avisoEstado;
  if (!pago) {
    avisoEstado = state.rol === 'admin' ? 'Como administrador, este pago quedará validado automáticamente.' : 'Este pago quedará pendiente de validación por el administrador.';
  } else if (state.rol !== 'admin' && pago.estado === 'validado') {
    avisoEstado = 'Este pago ya estaba validado — al guardar los cambios regresará a "pendiente de validar" para que el administrador lo revise de nuevo.';
  } else {
    avisoEstado = 'Se conserva el estado de validación actual de este pago.';
  }
  // Mismo criterio que en formCxp: el id del pago se fija aquí, al abrir el formulario — así un
  // reintento tras un timeout/falla de Google sobreescribe el mismo pago en vez de registrarlo
  // dos veces. "esEdicion" viaja aparte para no perder el mensaje correcto ("registrado" vs
  // "actualizado") ahora que pagoId ya siempre viene con un valor.
  const pagoIdEstable = pagoId || ('pago_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
  openModal(`
    <h2>${pago ? 'Editar pago' : 'Registrar pago'} — ${esc(proveedorNombre(c.proveedor_id))}</h2>
    <p style="color:var(--muted);font-size:12px;margin-top:-8px">Saldo pendiente: <b>${money(saldo)}</b></p>
    <form onsubmit="return guardarPago(event, '${cxpId}', '${pagoIdEstable}', ${pago ? 'true' : 'false'})">
      <div class="formGrid">
        <div class="field"><label>Monto a pagar</label><input type="number" step="0.01" id="pg_monto" max="${saldo}" value="${pago ? pago.monto : saldo}" required></div>
        <div class="field"><label>Fecha</label><input type="date" id="pg_fecha" value="${pago ? esc(pago.fecha) : formatYMD(new Date())}" max="${formatYMD(new Date())}" required></div>
        <div class="field full"><label>Pagado desde</label><select id="pg_pagar_desde">${opcionesPagarDesde(pago ? pago.pagar_desde : ip.pagar_desde)}</select></div>
        <div class="field full"><label>Cuenta destino (del proveedor)</label>
          <select id="pg_cuenta_destino_id" onchange="sugerirReferenciaPago('${c.proveedor_id}')">${opcionesCuentasDestino(c.proveedor_id, pago ? pago.cuenta_destino_id : ip.cuenta_destino_id)}</select>
          <p id="pg_cliente_hint" class="${clienteDeCuenta(c.proveedor_id, pago ? pago.cuenta_destino_id : ip.cuenta_destino_id) ? '' : 'hidden'}" style="font-size:11px;color:var(--muted);margin:4px 0 0">${esc(clienteDeCuenta(c.proveedor_id, pago ? pago.cuenta_destino_id : ip.cuenta_destino_id) ? 'Cliente: ' + clienteDeCuenta(c.proveedor_id, pago ? pago.cuenta_destino_id : ip.cuenta_destino_id) : '')}</p>
          ${cuentasDestino.length > 1 ? `<p style="font-size:11px;color:var(--muted);margin:4px 0 0">El proveedor tiene ${cuentasDestino.length} cuentas registradas — si la sugerida no sirve, elige otra aquí.</p>` : ''}
        </div>
        <div class="field full"><label>Referencia Pago</label><input id="pg_referencia" value="${esc(pago ? (pago.referencia||'') : (ip.referencia_sugerida||''))}"></div>
        <div class="field full"><label>Clave Rastreo Pago</label><input id="pg_clave_rastreo" value="${esc(pago?.clave_rastreo||'')}" placeholder="Clave de rastreo SPEI (si aplica)"></div>
        <div class="field full"><label>Banco origen</label><input id="pg_banco_origen" value="${esc(pago?.banco_origen||'')}"></div>
        <div class="field full"><label>Notas</label><input id="pg_notas" value="${esc(pago?.notas||'')}"></div>
        ${htmlCampoAdjunto('pagoComprobante', { titulo:'Comprobante de pago', esPrincipal:false, placeholder:'captura de la transferencia, si quieres respaldarlo', urlExistente: pago?.adjunto_comprobante_url })}
      </div>
      <p style="font-size:12px;color:var(--muted)">${avisoEstado}</p>
      <div class="modalActions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">${pago ? 'Guardar cambios' : 'Registrar pago'}</button>
      </div>
    </form>
  `);
}

async function guardarPago(ev, cxpId, pagoId, esEdicion) {
  ev.preventDefault();
  const fechaPago = document.getElementById('pg_fecha').value;
  if (fechaPago > formatYMD(new Date())) {
    toast('La fecha de pago no puede ser posterior a hoy.', 'error');
    return false;
  }
  const desbloquear = bloquearFormulario(ev.target, esEdicion ? 'Guardando…' : 'Registrando…');
  const record = {
    id: pagoId, // ya viene fijo desde formPago — seguro reintentar con el mismo id.
    cxp_id: cxpId,
    pagar_desde: document.getElementById('pg_pagar_desde').value,
    cuenta_destino_id: document.getElementById('pg_cuenta_destino_id').value,
    monto: document.getElementById('pg_monto').value,
    fecha: fechaPago,
    referencia: document.getElementById('pg_referencia').value,
    clave_rastreo: document.getElementById('pg_clave_rastreo').value,
    banco_origen: document.getElementById('pg_banco_origen').value,
    notas: document.getElementById('pg_notas').value,
    ...datosAdjuntoParaGuardar('pagoComprobante', 'comprobante_b64', 'comprobante_mime', 'comprobante_clear')
  };
  try {
    showLoading(true);
    // v6.10: mismo criterio que en guardarCxp — más margen de timeout si este pago trae un
    // comprobante nuevo (sube a Drive antes de escribir la fila).
    const res = await api('save', { entity: 'pagos', record }, record.comprobante_b64 ? { timeoutMs: API_TIMEOUT_MS_ADJUNTO } : undefined);
    await loadData();
    closeModal(); showLoading(false);
    toast(esEdicion ? 'Pago actualizado.' : 'Pago registrado.', 'ok');
    if (res.warning) toast(res.warning, 'warning');
    setView(state.view);
  } catch (err) { showLoading(false); desbloquear(); toast(err.message, 'error'); }
  return false;
}

function confirmarValidarPago(id) {
  openModal(`
    <h2>Validar pago</h2>
    <p>¿Confirmas que este pago fue capturado correctamente y debe marcarse como <b>validado</b>?</p>

/* ---------------- Vista: Gastos Recurrentes ---------------- */
// Catálogo de gastos que se repiten cada cierto número de meses con (normalmente) el mismo monto
// (p.ej. la renta de un local). El backend (generarGastosRecurrentes, corre solo todos los días a
// las 6am) genera automáticamente la CxP correspondiente unos días antes de que venza, y recorre
// "Próxima fecha de vencimiento" hacia adelante según la frecuencia — aquí solo se da de alta y se
// mantiene (p.ej. actualizar el monto una vez al año); el portal no genera nada por sí mismo, eso
// lo hace el trigger del lado de Apps Script.

function labelFrecuencia(n) {
  const map = { 1: 'Mensual', 2: 'Bimestral', 3: 'Trimestral', 6: 'Semestral', 12: 'Anual' };
  return map[n] || ('Cada ' + n + ' meses');
}

function opcionesFrecuencia(selected) {
  const valores = [1, 2, 3, 6, 12];
  return valores.map(v => `<option value="${v}" ${Number(selected||1)===v?'selected':''}>${labelFrecuencia(v)}</option>`).join('');
}

// Formatea un Date a "AAAA-MM-DD" usando sus componentes LOCALES (nunca toISOString, que convierte
// a UTC y puede correr la fecha un día — mismo cuidado que ya se tiene en parseFechaLocal/Code.gs).
function formatYMD(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Fecha estimada en que se generará la próxima CxP (próxima vencimiento menos días de anticipación) —
// solo para mostrarla en la tabla; el cálculo real y autoritativo ocurre en el backend.
function fechaEstimadaGeneracion(r) {
  const fv = parseFechaLocal(r.proxima_fecha_vencimiento);
  if (!fv) return null;
  const d = new Date(fv);
  d.setDate(d.getDate() - (Number(r.dias_anticipacion) || 0));
  return d;
}

  const main = document.getElementById('main');
  main.innerHTML = `

  renderRecurrentesTable();
}

  if (!proveedorIdRec) { toast('Elige un proveedor de la lista antes de guardar.', 'error'); return false; }
  const desbloquear = bloquearFormulario(ev.target, 'Guardando…');
  const record = {
    id, // ya viene fijo desde formRecurrente — seguro reintentar con el mismo id.
    proveedor_id: proveedorIdRec,
    concepto: document.getElementById('rec_concepto').value,
    monto: document.getElementById('rec_monto').value,
    sucursal: document.getElementById('rec_sucursal').value,
    frecuencia_meses: document.getElementById('rec_frecuencia_meses').value,

/* ---------------- Vista: Antigüedad de saldos (Aging) ---------------- */

function renderAging() {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const buckets = { vigente:{}, b30:{}, b60:{}, b90:{}, b90p:{} };
  const totales = { vigente:0, b30:0, b60:0, b90:0, b90p:0 };
  const pagosPorCxp = indexarPagosPorCxp(state.pagos);
  const provPorId = indexarProveedoresPorId(state.proveedores);

  state.cxp.forEach(c => {
    const saldo = saldoDesdeIndice(c.id, c.monto, pagosPorCxp);
    if (saldo <= 0.01) return;
    const prov = (provPorId.get(String(c.proveedor_id)) || {}).nombre || '(sin proveedor)';
    let bucket = 'vigente';
    if (c.fecha_vencimiento) {
      const fv = parseFechaLocal(c.fecha_vencimiento);
      const dias = diasEntre(hoy, fv);
      if (dias > 90) bucket = 'b90p';
      else if (dias > 60) bucket = 'b90';
      else if (dias > 30) bucket = 'b60';
      else if (dias > 0) bucket = 'b30';
      else bucket = 'vigente';
    }
    buckets[bucket][prov] = (buckets[bucket][prov] || 0) + saldo;
    totales[bucket] += saldo;
  });

  const proveedoresConSaldo = [...new Set([
    ...Object.keys(buckets.vigente), ...Object.keys(buckets.b30), ...Object.keys(buckets.b60),
    ...Object.keys(buckets.b90), ...Object.keys(buckets.b90p)
  ])].sort();

  const totalGeneral = Object.values(totales).reduce((a,b) => a+b, 0);

  __agingFilas = proveedoresConSaldo.map(prov => {
    const v = buckets.vigente[prov]||0, b30 = buckets.b30[prov]||0, b60 = buckets.b60[prov]||0, b90 = buckets.b90[prov]||0, b90p = buckets.b90p[prov]||0;
    return { prov, v, b30, b60, b90, b90p, total: v+b30+b60+b90+b90p };
  });
  __agingTotales = totales;
  __agingTotalGeneral = totalGeneral;

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle"><span>Antigüedad de saldos (Aging)</span></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Vigente</div><div class="value">${money(totales.vigente)}</div></div>
      <div class="kpi"><div class="label">1–30 días</div><div class="value">${money(totales.b30)}</div></div>
      <div class="kpi warn"><div class="label">31–60 días</div><div class="value">${money(totales.b60)}</div></div>
      <div class="kpi warn"><div class="label">61–90 días</div><div class="value">${money(totales.b90)}</div></div>
      <div class="kpi alert"><div class="label">+90 días</div><div class="value">${money(totales.b90p)}</div></div>
    </div>
    <div id="agingTableWrap"></div>
  `;
  renderAgingTable();
}

let __agingFilas = [], __agingTotales = {}, __agingTotalGeneral = 0;

function renderAgingTable() {
  const wrap = document.getElementById('agingTableWrap');
  if (!__agingFilas.length) { wrap.innerHTML = `<div class="tableWrap"><div class="emptyState">No hay saldos pendientes. 🎉</div></div>`; return; }
  const getters = { prov: r => r.prov, v: r => r.v, b30: r => r.b30, b60: r => r.b60, b90: r => r.b90, b90p: r => r.b90p, total: r => r.total };
  const filas = sortRows(__agingFilas, state.sortAging, getters);
  wrap.innerHTML = `<div class="tableWrap"><table>
      <thead><tr>
        ${sortTh('Proveedor','prov','sortAging','renderAgingTable')}
        ${sortTh('Vigente','v','sortAging','renderAgingTable')}

        ${sortTh('31–60','b60','sortAging','renderAgingTable')}
        ${sortTh('61–90','b90','sortAging','renderAgingTable')}
        ${sortTh('+90','b90p','sortAging','renderAgingTable')}
        ${sortTh('Total','total','sortAging','renderAgingTable')}
      </tr></thead>
      <tbody>${filas.map(r => `<tr><td>${esc(r.prov)}</td><td class="num">${money(r.v)}</td><td class="num">${money(r.b30)}</td><td class="num">${money(r.b60)}</td><td class="num">${money(r.b90)}</td><td class="num" style="color:var(--critical);font-weight:700">${money(r.b90p)}</td><td class="num" style="font-weight:700">${money(r.total)}</td></tr>`).join('')}
      <tr style="font-weight:700;background:#fafaf9"><td>Total</td><td class="num">${money(__agingTotales.vigente)}</td><td class="num">${money(__agingTotales.b30)}</td><td class="num">${money(__agingTotales.b60)}</td><td class="num">${money(__agingTotales.b90)}</td><td class="num">${money(__agingTotales.b90p)}</td><td class="num">${money(__agingTotalGeneral)}</td></tr>

  leerCuentasProveedorDesdeDOM();

function eliminarCuentaProveedorTmp(btn) {

async function guardarCuenta(ev, id) {

        <div class="field full"><label>Nombre</label><input id="us_nombre" value="${esc(u?.nombre||'')}" required></div>
        <div class="field"><label>Usuario (login)</label><input id="us_usuario" value="${esc(u?.usuario||'')}" required></div>
        <div class="field"><label>Rol</label><select id="us_rol">${Object.entries(ROLES_LABEL).map(([k,v]) => `<option value="${k}" ${u?.rol===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field full"><label>Contraseña ${u ? '(dejar en blanco para no cambiar)' : ''}</label><input id="us_pin" type="password" ${u?'':'required'}></div>
      </div>
      <div class="modalActions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  `);
}

async function guardarUsuario(ev, id) {
  ev.preventDefault();
  const desbloquear = bloquearFormulario(ev.target, 'Guardando…');
  const record = {
    id, // ya viene fijo desde formUsuario — seguro reintentar con el mismo id.
    nombre: document.getElementById('us_nombre').value,
    usuario: document.getElementById('us_usuario').value,
    rol: document.getElementById('us_rol').value,
    pin: document.getElementById('us_pin').value
  };
  try {
    showLoading(true);
    await api('saveUsuario', record);
    await loadUsuarios();
    closeModal(); showLoading(false);
    toast('Usuario guardado.', 'ok');
    renderUsuarios();
  } catch (err) { showLoading(false); desbloquear(); toast(err.message, 'error'); }
  return false;
}

function confirmarEliminarUsuario(id) {
  openModal(`
    <h2>Eliminar usuario</h2>
    <p>¿Confirmas eliminar a este usuario? No podrá volver a iniciar sesión.</p>
    <div class="modalActions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="eliminarUsuario('${id}')">Eliminar</button>
    </div>
  `);
}

async function eliminarUsuario(id) {
  try {
    showLoading(true);
    await api('deleteUsuario', { id });
    await loadUsuarios();
    closeModal(); showLoading(false);
    toast('Usuario eliminado.', 'ok');
    renderUsuarios();
  } catch (err) { showLoading(false); toast(err.message, 'error'); }
}

/* ---------------- Vista: Auditoría ---------------- */

function renderAuditoria() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle"><span>Auditoría — quién hizo qué y cuándo</span></div>
    <div id="auditoriaTableWrap"></div>
  `;
  renderAuditoriaTable();
}

// v7.3: se muestran los movimientos de los últimos AUDITORIA_DIAS días (hasta AUDITORIA_MAX_VISIBLES);
// el resto queda en un bloque colapsable "Movimientos anteriores".
const AUDITORIA_DIAS = 7;
const AUDITORIA_MAX_VISIBLES = 300;

function renderAuditoriaTable() {
  const wrap = document.getElementById('auditoriaTableWrap');
  const getters = {
    fecha: l => l.fecha || '',
    usuario_nombre: l => l.usuario_nombre || '',
    rol: l => ROLES_LABEL[l.rol] || l.rol || '',
    accion: l => l.accion || '',
    entidad: l => l.entidad || '',
    detalle: l => l.detalle || ''
  };
  const todos = state.log || [];
  const corte = Date.now() - AUDITORIA_DIAS * 86400000;
  const enVentana = todos.filter(l => new Date(l.fecha).getTime() >= corte);
  let recientes = enVentana.slice(0, AUDITORIA_MAX_VISIBLES);
  const excedente = enVentana.slice(AUDITORIA_MAX_VISIBLES);
  const anteriores = excedente.concat(todos.filter(l => !(new Date(l.fecha).getTime() >= corte)));
  const ordenar = lista => state.sortAuditoria.col ? sortRows(lista, state.sortAuditoria, getters) : lista;
  recientes = ordenar(recientes);
  const antiguos = ordenar(anteriores);

  const thead = `<thead><tr>
        ${sortTh('Fecha','fecha','sortAuditoria','renderAuditoriaTable')}
        ${sortTh('Usuario','usuario_nombre','sortAuditoria','renderAuditoriaTable')}
        ${sortTh('Rol','rol','sortAuditoria','renderAuditoriaTable')}
        ${sortTh('Acción','accion','sortAuditoria','renderAuditoriaTable')}
        ${sortTh('Entidad','entidad','sortAuditoria','renderAuditoriaTable')}
        ${sortTh('Detalle','detalle','sortAuditoria','renderAuditoriaTable')}
      </tr></thead>`;
  const fila = l => `
        <tr>
          <td>${new Date(l.fecha).toLocaleString('es-MX')}</td>
          <td>${esc(l.usuario_nombre)}</td>
          <td>${esc(ROLES_LABEL[l.rol] || l.rol)}</td>
          <td>${esc(l.accion)}</td>
          <td>${esc(l.entidad)}${l.entidad_id ? ' · ' + esc(l.entidad_id) : ''}</td>
          <td>${esc(l.detalle||'')}</td>
        </tr>`;
  const tabla = (lista, vacio) => `<div class="tableWrap"><table>${thead}<tbody>${lista.map(fila).join('') || `<tr><td colspan="6" class="emptyState">${vacio}</td></tr>`}</tbody></table></div>`;

  let nota;
  const topeSistema = todos.length >= 500 ? ' El sistema muestra como máximo los 500 movimientos más recientes.' : '';
  if (!todos.length) nota = '';
  else if (excedente.length) nota = `Mostrando los ${recientes.length} movimientos más recientes de los últimos ${AUDITORIA_DIAS} días (hay ${enVentana.length}). El resto está en «Movimientos anteriores».${topeSistema}`;
  else nota = `Mostrando los últimos ${AUDITORIA_DIAS} días (${recientes.length} movimientos). Lo anterior está en «Movimientos anteriores».${topeSistema}`;

  wrap.innerHTML =
    (nota ? `<p class="audNota">${nota}</p>` : '') +
    tabla(recientes, todos.length ? `Sin movimientos en los últimos ${AUDITORIA_DIAS} días.` : 'Sin movimientos registrados todavía.') +
    (antiguos.length
      ? `<details class="audAnteriores" id="audAnteriores"${state.auditoriaAbierto ? ' open' : ''} ontoggle="state.auditoriaAbierto=this.open">
           <summary>Movimientos anteriores (${antiguos.length})</summary>
           ${tabla(antiguos, '')}
         </details>`
      : '');
}

/* ---------------- Vista: Exportar ---------------- */

function renderExportar() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="viewTitle"><span>Exportar</span></div>
    <div class="card">
      <div class="cardTitle">Descargar datos en CSV</div>
      <div class="actions" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportarCxpCsv()">Cuentas × Pagar</button>
        <button class="btn btn-ghost" onclick="exportarPagosCsv()">Pagos Realizados</button>
        <button class="btn btn-ghost" onclick="exportarProveedoresCsv()">Proveedores</button>
        <button class="btn btn-ghost" onclick="exportarRecurrentesCsv()">Gastos Recurrentes</button>
      </div>
    </div>
  `;
}

function descargarCsv(filename, headers, rows) {
  const esc2 = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [headers.map(esc2).join(',')].concat(rows.map(r => r.map(esc2).join(','))).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function exportarCxpCsv() {
  const rows = state.cxp.map(c => [c.id, proveedorNombre(c.proveedor_id), c.concepto, c.sucursal, c.fecha_factura, c.fecha_vencimiento, c.monto, saldoCxp(c.id, c.monto), c.folio, c.uuid_cfdi]);
  descargarCsv('cxp_' + new Date().toISOString().slice(0,10) + '.csv', ['id','proveedor','concepto','sucursal','fecha_factura','fecha_vencimiento','monto','saldo','folio','uuid_cfdi'], rows);
}
function exportarPagosCsv() {
  const rows = state.pagos.map(p => {
    const cxpDePago = state.cxp.find(x => String(x.id) === String(p.cxp_id));
    const cuentaDestinoLbl = cxpDePago ? (labelCuentaDestino(cxpDePago.proveedor_id, p.cuenta_destino_id) || '') : '';
    return [p.id, p.cxp_id, p.monto, p.fecha, p.referencia, p.clave_rastreo, p.banco_origen, cuentaDestinoLbl, p.notas, p.capturado_por, p.estado, p.validado_por, p.fecha_validacion];
  });
  descargarCsv('pagos_' + new Date().toISOString().slice(0,10) + '.csv', ['id','cxp_id','monto','fecha','referencia','clave_rastreo','banco_origen','cuenta_destino','notas','capturado_por','estado','validado_por','fecha_validacion'], rows);
}
function exportarProveedoresCsv() {
  const rows = state.proveedores.map(p => [p.id, p.nombre, p.rfc, p.email, p.telefono, p.notas]);
  descargarCsv('proveedores_' + new Date().toISOString().slice(0,10) + '.csv', ['id','nombre','rfc','email','telefono','notas'], rows);
}
function exportarRecurrentesCsv() {
  const rows = state.recurrentes.map(r => [r.id, proveedorNombre(r.proveedor_id), r.concepto, r.sucursal, r.monto, labelFrecuencia(Number(r.frecuencia_meses)||1), r.proxima_fecha_vencimiento, r.dias_anticipacion, r.activo ? 'Activo' : 'Pausado', r.notas]);
  descargarCsv('gastos_recurrentes_' + new Date().toISOString().slice(0,10) + '.csv', ['id','proveedor','concepto','sucursal','monto','frecuencia','proxima_fecha_vencimiento','dias_anticipacion','estado','notas'], rows);
}

/* ---------------- Boot ---------------- */

async function bootApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoNombre').textContent = state.nombre;
  document.getElementById('whoRol').textContent = ROLES_LABEL[state.rol] || state.rol;
  document.getElementById('whoAvatar').textContent = (state.nombre || '?').slice(0,1).toUpperCase();
  showLoading(true);
  try {
    await loadData();
    showLoading(false);
    renderTabs();
    // Vuelve a la pestaña donde estaba antes de recargar (F5) en vez de siempre al Dashboard —
    // solo si esa pestaña sigue siendo válida para su rol (por si cambió de rol mientras tanto).
    let ultimaVista = 'dashboard';
    try {
      const guardada = sessionStorage.getItem(ULTIMA_VISTA_KEY);
      if (guardada && TABS.some(t => t.id === guardada && can(t.roles))) ultimaVista = guardada;
    } catch (e) {}
    setView(ultimaVista);
  } catch (err) {
    showLoading(false);
    if (/sesión inválida|sesión expirada/i.test(err.message)) {
      // Token guardado ya no sirve (expiró en el backend u otro dispositivo cerró la sesión) —
      // hay que borrarlo antes de recargar, si no se queda en loop intentando restaurarlo.
      borrarSesionLocal();
      try { sessionStorage.setItem(MOTIVO_KEY, 'Tu sesión expiró. Vuelve a iniciar sesión.'); } catch (e) {}
      location.reload();
    } else {
      toast(err.message, 'error');
    }
  }
}

document.getElementById('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');
  btn.textContent = 'Entrando…'; btn.disabled = true;
  try {
    await login(document.getElementById('loginUsuario').value.trim(), document.getElementById('loginPin').value.trim());
  } catch (err) {
    errBox.textContent = err.message; errBox.classList.remove('hidden');
  } finally {
    btn.textContent = 'Iniciar sesión'; btn.disabled = false;
  }
});

// Si el último cierre de sesión fue automático (expiró o por inactividad), mostrar por qué antes
// de que el usuario intente entrar de nuevo — si no, parece que la contraseña falló sin motivo.
(function mostrarMotivoDeLogoutSiAplica() {
  try {
    const motivo = sessionStorage.getItem(MOTIVO_KEY);
    if (motivo) {
      sessionStorage.removeItem(MOTIVO_KEY);
      const errBox = document.getElementById('loginError');
      errBox.textContent = motivo;
      errBox.classList.remove('hidden');
    }
  } catch (e) {}
})();

// Al cargar/recargar la página (F5, deslizar en iPhone), si ya había una sesión guardada en
// sessionStorage de ESTA misma pestaña, se restaura directo sin pedir login de nuevo. Si el
// token ya expiró, bootApp() lo detecta por su cuenta (ver el catch de arriba) y vuelve a
// mostrar el login.
(function restaurarSesionAlCargar() {
  const s = leerSesionLocal();
  if (s && s.token) {
    state.token = s.token; state.nombre = s.nombre; state.rol = s.rol;
    bootApp();
  }
})();

// Cierre automático por inactividad (60 min sin click/tecleo/touch/scroll) — ver
// INACTIVIDAD_LIMITE_MS arriba. Cualquier interacción reinicia el contador; el chequeo corre
// cada 30s, que sobra de margen para una ventana de 60 minutos.
['click', 'keydown', 'touchstart', 'mousemove', 'scroll'].forEach(ev =>
  document.addEventListener(ev, () => { ultimaActividad = Date.now(); }, { passive: true })
);
setInterval(() => {
  if (!state.token) return; // no hay sesión activa, nada que cerrar
  if (Date.now() - ultimaActividad >= INACTIVIDAD_LIMITE_MS) {
    logout('Tu sesión se cerró por inactividad (60 min). Vuelve a iniciar sesión.');
  }
}, 30000);

// Cierra cualquier menú "Opciones" abierto de Cuentas × Pagar al hacer clic en cualquier otra
// parte de la página (el propio botón ⋮ detiene la propagación, ver toggleMenuCxp).
document.addEventListener('click', cerrarMenusCxp);

</script>
